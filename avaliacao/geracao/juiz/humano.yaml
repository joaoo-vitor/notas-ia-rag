- item: j0246
  pergunta: Meu ex contou para várias pessoas que eu cometi um crime, mas é mentira. O que isso pode ser?
  resposta: Sinto muito que você esteja passando por isso. Segundo a lei, caluniar alguém, dizendo que
    essa pessoa cometeu um crime que ela não cometeu, é considerado o crime de calúnia [1]. Também comete
    calúnia quem, sabendo que a acusação é falsa, espalha ou divulga essa informação para outras pessoas
    [1]. As leis consultadas não trazem informações sobre como proceder ou onde buscar ajuda, apenas definem
    o que configura a calúnia.
  trechos_fornecidos:
  - n: 1
    fonte: Código Penal (Decreto-Lei nº 2.848/1940), Art. 138
    texto: 'Calúnia

      Art. 138 - Caluniar alguém, imputando-lhe falsamente fato definido como crime:

      Pena - detenção, de seis meses a dois anos, e multa.

      § 1º - Na mesma pena incorre quem, sabendo falsa a imputação, a propala ou divulga.

      § 2º - É punível a calúnia contra os mortos.

      Exceção da verdade

      § 3º - Admite-se a prova da verdade, salvo:

      I - se, constituindo o fato imputado crime de ação privada, o ofendido não foi condenado por sentença
      irrecorrível;

      II - se o fato é imputado a qualquer das pessoas indicadas no nº I do art. 141;

      III - se do crime imputado, embora de ação pública, o ofendido foi absolvido por sentença irrecorrível.'
  - n: 2
    fonte: Código Penal (Decreto-Lei nº 2.848/1940), Art. 139
    texto: 'Difamação

      Art. 139 - Difamar alguém, imputando-lhe fato ofensivo à sua reputação:

      Pena - detenção, de três meses a um ano, e multa.

      Exceção da verdade

      Parágrafo único - A exceção da verdade somente se admite se o ofendido é funcionário público e a
      ofensa é relativa ao exercício de suas funções.'
  referencia:
