- item: j0014
  pergunta: Além da polícia, quais serviços públicos podem me ajudar nessa situação?
  resposta: Sinto muito pelo que você está passando. Além da polícia, existem outros serviços que podem
    te apoiar. Você tem direito a buscar a Defensoria Pública ou a Assistência Judiciária Gratuita para
    receber atendimento específico e humanizado [2]. O Ministério Público também pode requisitar serviços
    de saúde, educação, assistência social e de segurança [3]. A autoridade policial pode encaminhá-la
    ao hospital, posto de saúde ou ao Instituto Médico Legal [4], além de poder requisitar outros serviços
    públicos necessários para a sua defesa e a de seus dependentes [1]. Além disso, a polícia deve fornecer
    transporte para abrigo ou local seguro em caso de risco de vida [4].
  trechos_fornecidos:
  - n: 1
    fonte: Lei nº 11.340/2006 (Lei Maria da Penha), Art. 12-B
    texto: 'Art. 12-B. (VETADO).

      § 3º A autoridade policial poderá requisitar os serviços públicos necessários à defesa da mulher
      em situação de violência doméstica e familiar e de seus dependentes.'
  - n: 2
    fonte: Lei nº 11.340/2006 (Lei Maria da Penha), Art. 28
    texto: Art. 28. É garantido a toda mulher em situação de violência doméstica e familiar o acesso aos
      serviços de Defensoria Pública ou de Assistência Judiciária Gratuita, nos termos da lei, em sede
      policial e judicial, mediante atendimento específico e humanizado.
  - n: 3
    fonte: Lei nº 11.340/2006 (Lei Maria da Penha), Art. 26
    texto: 'Art. 26. Caberá ao Ministério Público, sem prejuízo de outras atribuições, nos casos de violência
      doméstica e familiar contra a mulher, quando necessário:

      I - requisitar força policial e serviços públicos de saúde, de educação, de assistência social e
      de segurança, entre outros;

      II - fiscalizar os estabelecimentos públicos e particulares de atendimento à mulher em situação
      de violência doméstica e familiar, e adotar, de imediato, as medidas administrativas ou judiciais
      cabíveis no tocante a quaisquer irregularidades constatadas;

      III - cadastrar os casos de violência doméstica e familiar contra a mulher.'
  - n: 4
    fonte: Lei nº 11.340/2006 (Lei Maria da Penha), Art. 11
    texto: 'Art. 11. No atendimento à mulher em situação de violência doméstica e familiar, a autoridade
      policial deverá, entre outras providências:

      I - garantir proteção policial, quando necessário, comunicando de imediato ao Ministério Público
      e ao Poder Judiciário;

      II - encaminhar a ofendida ao hospital ou posto de saúde e ao Instituto Médico Legal;

      III - fornecer transporte para a ofendida e seus dependentes para abrigo ou local seguro, quando
      houver risco de vida;

      IV - se necessário, acompanhar a ofendida para assegurar a retirada de seus pertences do local da
      ocorrência ou do domicílio familiar;

      V - informar à ofendida os direitos a ela conferidos nesta Lei e os serviços disponíveis, inclusive
      os de assistência judiciária para o eventual ajuizamento perante o juízo competente da ação de separação
      judicial, de divórcio, de anulação de casamento ou de dissolução de união estável.

      Parágrafo único. Verificados indícios de redução a condição análoga à de escravo ou outra forma
      de violência doméstica contra a trabalhadora doméstica, a autoridade policial que tomar conhecimento
      da ocorrência deverá comunicá-la, em até 48 (quarenta e oito) horas, à unidade regional do Ministério
      do Trabalho e Emprego e ao Ministério Público do Trabalho.'
  - n: 5
    fonte: Lei nº 11.340/2006 (Lei Maria da Penha), Art. 10-A
    texto: 'Art. 10-A. É direito da mulher em situação de violência doméstica e familiar o atendimento
      policial e pericial especializado, ininterrupto e prestado por servidores - preferencialmente do
      sexo feminino - previamente capacitados.

      § 1º A inquirição de mulher em situação de violência doméstica e familiar ou de testemunha de violência
      doméstica, quando se tratar de crime contra a mulher, obedecerá às seguintes diretrizes:

      I - salvaguarda da integridade física, psíquica e emocional da depoente, considerada a sua condição
      peculiar de pessoa em situação de violência doméstica e familiar;

      II - garantia de que, em nenhuma hipótese, a mulher em situação de violência doméstica e familiar,
      familiares e testemunhas terão contato direto com investigados ou suspeitos e pessoas a eles relacionadas;

      III - não revitimização da depoente, evitando sucessivas inquirições sobre o mesmo fato nos âmbitos
      criminal, cível e administrativo, bem como questionamentos sobre a vida privada.

      § 2º Na inquirição de mulher em situação de violência doméstica e familiar ou de testemunha de delitos
      de que trata esta Lei, adotar-se-á, preferencialmente, o seguinte procedimento:

      I - a inquirição será feita em recinto especialmente projetado para esse fim, o qual conterá os
      equipamentos próprios e adequados à idade da mulher em situação de violência doméstica e familiar
      ou testemunha e ao tipo e à gravidade da violência sofrida;

      II - quando for o caso, a inquirição será intermediada por profissional especializado em violência
      doméstica e familiar designado pela autoridade judiciária ou policial;

      III - o depoimento será registrado em meio eletrônico ou magnético, devendo a degravação e a mídia
      integrar o inquérito.'
  referencia:
  - n: 1
    fonte: Lei nº 11.340/2006 (Lei Maria da Penha), Art. 9 (parte 1/2)
    texto: 'Art. 9º A assistência à mulher em situação de violência doméstica e familiar será prestada
      em caráter prioritário no Sistema Único de Saúde (SUS) e no Sistema Único de Segurança Pública (Susp),
      de forma articulada e conforme os princípios e as diretrizes previstos na Lei nº 8.742, de 7 de
      dezembro de 1993 (Lei Orgânica da Assistência Social), e em outras normas e políticas públicas de
      proteção, e emergencialmente, quando for o caso.

      § 1º O juiz determinará, por prazo certo, a inclusão da mulher em situação de violência doméstica
      e familiar no cadastro de programas assistenciais do governo federal, estadual e municipal.

      § 2º O juiz assegurará à mulher em situação de violência doméstica e familiar, para preservar sua
      integridade física e psicológica:

      I - acesso prioritário à remoção quando servidora pública, integrante da administração direta ou
      indireta;

      II - manutenção do vínculo trabalhista, quando necessário o afastamento do local de trabalho, por
      até seis meses.

      III - encaminhamento à assistência judiciária, quando for o caso, inclusive para eventual ajuizamento
      da ação de separação judicial, de divórcio, de anulação de casamento ou de dissolução de união estável
      perante o juízo competente.

      § 3º A assistência à mulher em situação de violência doméstica e familiar compreenderá o acesso
      aos benefícios decorrentes do desenvolvimento científico e tecnológico, incluindo os serviços de
      contracepção de emergência, a profilaxia das Doenças Sexualmente Transmissíveis (DST) e da Síndrome
      da Imunodeficiência Adquirida (AIDS) e outros procedimentos médicos necessários e cabíveis nos casos
      de violência sexual.

      Aquele que, por ação ou omissão, causar lesão, violência física, sexual ou psicológica e dano moral
      ou patrimonial a mulher fica obrigado a ressarcir todos os danos causados, inclusive ressarcir ao
      Sistema Único de Saúde (SUS), de acordo com a tabela SUS, os custos relativos aos serviços de saúde
      prestados para o total tratamento das vítimas em situação de violência doméstica e familiar, recolhidos
      os recursos assim arrecadados ao Fundo de Saúde do ente federado responsável pelas unidades de saúde
      que prestarem os serviços.

      § 5º Os dispositivos de segurança destinados ao uso em caso de perigo iminente e disponibilizados
      para o monitoramento das vítimas de violência doméstica ou familiar amparadas por medidas protetivas
      terão seus custos ressarcidos pelo agressor.'
  - n: 2
