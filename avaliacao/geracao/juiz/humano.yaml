# Anotação humana: siga avaliacao/geracao/juiz/instrucoes.md e preencha, em cada
# item, fiel (sim: todas as afirmações apoiadas | nao), correcao e utilidade.
# Não abra chave.json nem as avaliações do juiz antes de terminar.
- item: j0420
  pergunta: Em que condições a restrição ou suspensão de visitas aos dependentes menores pode ser decretada?
  resposta: A restrição ou suspensão de visitas aos dependentes menores pode ser decretada pelo juiz quando
    for constatada a prática de violência doméstica e familiar contra a mulher [1]. Para a aplicação dessa
    medida, é necessária a oitiva da equipe de atendimento multidisciplinar ou serviço similar [1].
  trechos_fornecidos:
  - n: 1
    fonte: Lei nº 11.340/2006 (Lei Maria da Penha), Art. 22 (parte 1/2)
    texto: 'Art. 22. Constatada a prática de violência doméstica e familiar contra a mulher, nos termos
      desta Lei, o juiz poderá aplicar, de imediato, ao agressor, em conjunto ou separadamente, as seguintes
      medidas protetivas de urgência, entre outras:

      I - suspensão da posse ou restrição do porte de armas, com comunicação ao órgão competente, nos
      termos da Lei nº 10.826, de 22 de dezembro de 2003 ;

      II - afastamento do lar, domicílio ou local de convivência com a ofendida;

      III - proibição de determinadas condutas, entre as quais:

      a) aproximação da ofendida, de seus familiares e das testemunhas, fixando o limite mínimo de distância
      entre estes e o agressor;

      b) contato com a ofendida, seus familiares e testemunhas por qualquer meio de comunicação;

      c) freqüentação de determinados lugares a fim de preservar a integridade física e psicológica da
      ofendida;

      IV - restrição ou suspensão de visitas aos dependentes menores, ouvida a equipe de atendimento multidisciplinar
      ou serviço similar;

      V - prestação de alimentos provisionais ou provisórios.

      VI – comparecimento do agressor a programas de recuperação e reeducação; e

      VII – acompanhamento psicossocial do agressor, por meio de atendimento individual e/ou em grupo
      de apoio.

      VIII – monitoração eletrônica, disponibilizando-se à vítima aplicação ou dispositivo de segurança
      que alerte sobre eventual aproximação do agressor.

      § 1º As medidas referidas neste artigo não impedem a aplicação de outras previstas na legislação
      em vigor, sempre que a segurança da ofendida ou as circunstâncias o exigirem, devendo a providência
      ser comunicada ao Ministério Público.

      § 2º Na hipótese de aplicação do inciso I, encontrando-se o agressor nas condições mencionadas no
      caput e incisos do art. 6º da Lei nº 10.826, de 22 de dezembro de 2003, o juiz comunicará ao respectivo
      órgão, corporação ou instituição as medidas protetivas de urgência concedidas e determinará a restrição
      do porte de armas, ficando o superior imediato do agressor responsável pelo cumprimento da determinação
      judicial, sob pena de incorrer nos crimes de prevaricação ou de desobediência, conforme o caso.

      § 3º Para garantir a efetividade das medidas protetivas de urgência, poderá o juiz requisitar, a
      qualquer momento, auxílio da força policial.

      § 4º Na aplicação das medidas protetivas de urgência, o juiz concederá a tutela específica ou determinará
      providências que assegurem a obtenção de tutela pelo resultado prático equivalente.'
  - n: 2
    fonte: Código Penal (Decreto-Lei nº 2.848/1940), Art. 121 (parte 1/2)
    texto: 'Homicídio simples

      Art. 121. Matar alguem:

      Pena - reclusão, de seis a vinte anos.

      Caso de diminuição de pena

      § 1º Se o agente comete o crime impelido por motivo de relevante valor social ou moral, ou sob o
      domínio de violenta emoção, logo em seguida a injusta provocação da vítima, o juiz pode reduzir
      a pena de um sexto a um terço.

      Homicídio qualificado

      § 2° Se o homicídio é cometido:

      I - mediante paga ou promessa de recompensa, ou por outro motivo torpe;

      II - por motivo futil;

      III - com emprego de veneno, fogo, explosivo, asfixia, tortura ou outro meio insidioso ou cruel,
      ou de que possa resultar perigo comum;

      IV - à traição, de emboscada, ou mediante dissimulação ou outro recurso que dificulte ou torne impossivel
      a defesa do ofendido;

      V - para assegurar a execução, a ocultação, a impunidade ou vantagem de outro crime:

      Pena - reclusão, de doze a trinta anos.

      Feminicídio

      VII – contra:

      a) autoridade ou agente descrito nos arts. 142 e 144 da Constituição Federal, integrantes do sistema
      prisional e da Força Nacional de Segurança Pública, no exercício da função ou em decorrência dela,
      ou contra seu cônjuge, companheiro ou parente consanguíneo até o terceiro grau, em razão dessa condição;

      b) membro do Poder Judiciário, do Ministério Público, da Defensoria Pública ou da Advocacia Pública,
      de que tratam os arts. 131 e 132 da Constituição Federal, ou oficial de justiça, no exercício da
      função ou em decorrência dela, ou contra seu cônjuge, companheiro ou parente, inclusive por afinidade,
      até o terceiro grau, em razão dessa condição;

      VIII - com emprego de arma de fogo de uso restrito ou proibido:

      Homicídio contra menor de 14 (quatorze) anos Vigência

      IX - contra menor de 14 (quatorze) anos: Vigência

      X - nas dependências de instituição de ensino:

      Pena - reclusão, de doze a trinta anos.

      § 2o-A

      § 2º-B. A pena do homicídio contra menor de 14 (quatorze) anos é aumentada de: Vigência

      I - 1/3 (um terço) até a metade se a vítima é pessoa com deficiência ou com doença que implique
      o aumento de sua vulnerabilidade; Vigência

      II - 2/3 (dois terços) se o autor é ascendente, padrasto ou madrasta, tio, irmão, cônjuge, companheiro,
      tutor, curador, preceptor ou empregador da vítima ou por qualquer outro título tiver autoridade
      sobre ela. Vigência

      III - 2/3 (dois terços) se o crime for praticado em instituição de educação básica pública ou privada.

      § 2º-C. A pena do homicídio cometido nas dependências de instituição de ensino é aumentada de:'
  - n: 3
    fonte: Código Penal (Decreto-Lei nº 2.848/1940), Art. 147-A
    texto: 'Perseguição

      Art. 147-A. Perseguir alguém, reiteradamente e por qualquer meio, ameaçando-lhe a integridade física
      ou psicológica, restringindo-lhe a capacidade de locomoção ou, de qualquer forma, invadindo ou perturbando
      sua esfera de liberdade ou privacidade.

      Pena – reclusão, de 6 (seis) meses a 2 (dois) anos, e multa.

      § 1º A pena é aumentada de metade se o crime é cometido:

      I – contra criança, adolescente ou idoso;

      II – contra mulher por razões da condição de sexo feminino, nos termos do § 2º-A do art. 121 deste
      Código;

      III – mediante concurso de 2 (duas) ou mais pessoas ou com o emprego de arma.

      § 2º As penas deste artigo são aplicáveis sem prejuízo das correspondentes à violência.

      § 3º Somente se procede mediante representação.'
  - n: 4
    fonte: Lei nº 11.340/2006 (Lei Maria da Penha), Art. 35
    texto: 'Art. 35. A União, o Distrito Federal, os Estados e os Municípios poderão criar e promover,
      no limite das respectivas competências:

      I - centros de atendimento integral e multidisciplinar para mulheres e respectivos dependentes em
      situação de violência doméstica e familiar;

      II - casas-abrigos para mulheres e respectivos dependentes menores em situação de violência doméstica
      e familiar;

      III - delegacias, núcleos de defensoria pública, serviços de saúde e centros de perícia médico-legal
      especializados no atendimento à mulher em situação de violência doméstica e familiar;

      IV - programas e campanhas de enfrentamento da violência doméstica e familiar;

      V - centros de educação e de reabilitação para os agressores.

      Parágrafo único. As campanhas a que se refere o inciso IV do caput deste artigo deverão contemplar
      informações sobre procedimentos e abordagens policiais, prevenção à revitimização, funcionamento
      das medidas protetivas de urgência e mecanismos de monitoração eletrônica.'
  - n: 5
    fonte: Decreto nº 1.973/1996 (Convenção de Belém do Pará), Art. 9
    texto: 'Artigo 9

      Para a adoção das medidas a que se refere este capitulo, os Estados Partes levarão especialmente
      em conta a situação da mulher vulnerável a violência por sua raça, origem étnica ou condição de
      migrante, de refugiada ou de deslocada, entre outros motivos. Também será considerada violência
      a mulher gestante, deficiente, menor, idosa ou em situação sócio-econômica desfavorável, afetada
      por situações de conflito armado ou de privação da liberdade.'
