- item: j0439
  pergunta: O que o ministerio publico faz em casos de violencia?
  resposta: O Ministério Público atua para proteger seus direitos e garantir que a lei seja cumprida.
    Nos casos de violência doméstica, ele tem o dever de investigar, oferecer a denúncia contra o agressor
    e fiscalizar o processo judicial. Ele pode solicitar medidas protetivas de urgência para garantir
    sua segurança e também pedir a aplicação de penas ao agressor. Sua função é zelar pela aplicação da
    lei e atuar como fiscal da ordem jurídica, garantindo que você tenha acesso à Justiça com proteção.
    Você pode buscar o atendimento especializado na Promotoria de Justiça de sua cidade.
  trechos_fornecidos: []
  referencia:
  - n: 1
    fonte: Lei nº 11.340/2006 (Lei Maria da Penha), Art. 25
    texto: Art. 25. O Ministério Público intervirá, quando não for parte, nas causas cíveis e criminais
      decorrentes da violência doméstica e familiar contra a mulher.
  - n: 2
    fonte: Lei nº 11.340/2006 (Lei Maria da Penha), Art. 26
    texto: 'Art. 26. Caberá ao Ministério Público, sem prejuízo de outras atribuições, nos casos de violência
      doméstica e familiar contra a mulher, quando necessário:

      I - requisitar força policial e serviços públicos de saúde, de educação, de assistência social e
      de segurança, entre outros;

      II - fiscalizar os estabelecimentos públicos e particulares de atendimento à mulher em situação
      de violência doméstica e familiar, e adotar, de imediato, as medidas administrativas ou judiciais
      cabíveis no tocante a quaisquer irregularidades constatadas;

      III - cadastrar os casos de violência doméstica e familiar contra a mulher.'
  fiel: nao
  correcao: parcial
  utilidade: 2
  comentario: ''
- item: j0245
  pergunta: A lei Maria da Penha vale quando quem agride é uma mulher?
  resposta: Sim, a Lei Maria da Penha (Lei 11.340/2006) protege mulheres que sofrem violência doméstica
    ou familiar praticada por qualquer pessoa, independentemente do gênero de quem agride. O que define
    a aplicação da lei não é o sexo do agressor, mas a relação de afeto, parentesco ou convivência entre
    a vítima e a pessoa que cometeu o ato, dentro do ambiente doméstico ou familiar. O objetivo central
    é coibir a violência baseada no gênero, garantindo que a mulher tenha acesso a medidas protetivas
    e assistência especializada. Se você está passando por isso, saiba que existem redes de apoio como
    o Ligue 180, que oferecem orientações e encaminhamentos seguros.
  trechos_fornecidos: []
  referencia:
  - n: 1
    fonte: Lei nº 11.340/2006 (Lei Maria da Penha), Art. 5
    texto: 'Art. 5º Para os efeitos desta Lei, configura violência doméstica e familiar contra a mulher
      qualquer ação ou omissão baseada no gênero que lhe cause morte, lesão, sofrimento físico, sexual
      ou psicológico e dano moral ou patrimonial:

      I - no âmbito da unidade doméstica, compreendida como o espaço de convívio permanente de pessoas,
      com ou sem vínculo familiar, inclusive as esporadicamente agregadas;

      II - no âmbito da família, compreendida como a comunidade formada por indivíduos que são ou se consideram
      aparentados, unidos por laços naturais, por afinidade ou por vontade expressa;

      III - em qualquer relação íntima de afeto, na qual o agressor conviva ou tenha convivido com a ofendida,
      independentemente de coabitação.

      Parágrafo único. As relações pessoais enunciadas neste artigo independem de orientação sexual.'
  - n: 2
    fonte: Precedentes do STJ sobre a Lei Maria da Penha, Proteção da vítima independe do gênero de quem
      agride
    texto: O relator, ministro Jorge Mussi (aposentado), explicou que o sujeito ativo da violência doméstica
      pode ser homem ou mulher, bastando que esteja presente uma situação de vulnerabilidade caracterizada
      por relação de poder ou submissão. Para ele, a Lei Maria da Penha pode incidir nas relações entre
      filhas e mãe quando a violência decorre da relação de intimidade e afeto existente entre elas.
  fiel: sim
  correcao: correta
  utilidade: 5
  comentario: ''
