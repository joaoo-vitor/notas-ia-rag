- item: j0178
  pergunta: N sei oq fazer, ele levou meu celular e to presa em casa
  resposta: Sinto muito que você esteja passando por isso. O que você descreveu, como a retenção do seu
    celular, é considerado violência patrimonial [1]. Além disso, a limitação do seu direito de ir e vir
    caracteriza violência psicológica [3]. O ato de privar alguém de liberdade é um crime previsto no
    Código Penal [4]. Caso haja risco à sua vida ou integridade física, o agressor pode ser afastado do
    lar por autoridades policiais ou judiciais [2]. Como você está em uma situação delicada, saiba que
    a lei reconhece o seu direito de não ser controlada ou mantida presa. Não encontrei nos trechos orientações
    específicas sobre como pedir ajuda imediata estando sem celular, mas a lei destaca que o afastamento
    do agressor pode ocorrer em situações de risco [2].
