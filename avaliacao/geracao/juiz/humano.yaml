- item: j0258
  pergunta: posso pedir o divorcio no juizado de violencia domestica?
  resposta: Sim, você tem a opção de pedir o divórcio ou a dissolução de união estável diretamente no
    Juizado de Violência Doméstica e Familiar contra a Mulher [1]. É importante saber que, embora esse
    juizado possa tratar do pedido de divórcio, a partilha de bens não faz parte da competência dele [1].
  trechos_fornecidos:
  - n: 1
    fonte: Lei nº 11.340/2006 (Lei Maria da Penha), Art. 14-A
    texto: 'Art. 14-A. A ofendida tem a opção de propor ação de divórcio ou de dissolução de união estável
      no Juizado de Violência Doméstica e Familiar contra a Mulher.

      § 1º Exclui-se da competência dos Juizados de Violência Doméstica e Familiar contra a Mulher a pretensão
      relacionada à partilha de bens.

      § 2º Iniciada a situação de violência doméstica e familiar após o ajuizamento da ação de divórcio
      ou de dissolução de união estável, a ação terá preferência no juízo onde estiver.'
  - n: 2
    fonte: Lei nº 11.340/2006 (Lei Maria da Penha), Art. 18
    texto: 'Art. 18. Recebido o expediente com o pedido da ofendida, caberá ao juiz, no prazo de 48 (quarenta
      e oito) horas:

      I - conhecer do expediente e do pedido e decidir sobre as medidas protetivas de urgência;

      II - determinar o encaminhamento da ofendida ao órgão de assistência judiciária, quando for o caso,
      inclusive para o ajuizamento da ação de separação judicial, de divórcio, de anulação de casamento
      ou de dissolução de união estável perante o juízo competente;

      III - comunicar ao Ministério Público para que adote as providências cabíveis.

      IV - determinar a apreensão imediata de arma de fogo sob a posse do agressor.'
  - n: 3
    fonte: Lei nº 11.340/2006 (Lei Maria da Penha), Art. 33
    texto: 'Art. 33. Enquanto não estruturados os Juizados de Violência Doméstica e Familiar contra a
      Mulher, as varas criminais acumularão as competências cível e criminal para conhecer e julgar as
      causas decorrentes da prática de violência doméstica e familiar contra a mulher, observadas as previsões
      do Título IV desta Lei, subsidiada pela legislação processual pertinente.

      Parágrafo único. Será garantido o direito de preferência, nas varas criminais, para o processo e
      o julgamento das causas referidas no caput.'
  - n: 4
    fonte: Lei nº 11.340/2006 (Lei Maria da Penha), Art. 14
    texto: 'Art. 14. Os Juizados de Violência Doméstica e Familiar contra a Mulher, órgãos da Justiça
      Ordinária com competência cível e criminal, poderão ser criados pela União, no Distrito Federal
      e nos Territórios, e pelos Estados, para o processo, o julgamento e a execução das causas decorrentes
      da prática de violência doméstica e familiar contra a mulher.

      Parágrafo único. Os atos processuais poderão realizar-se em horário noturno, conforme dispuserem
      as normas de organização judiciária.'
  - n: 5
    fonte: Lei nº 11.340/2006 (Lei Maria da Penha), Art. 34
    texto: Art. 34. A instituição dos Juizados de Violência Doméstica e Familiar contra a Mulher poderá
      ser acompanhada pela implantação das curadorias necessárias e do serviço de assistência judiciária.
  referencia:
