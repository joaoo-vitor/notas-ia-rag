- item: j0268
  pergunta: Como funciona a restrição ou suspensão da posse e porte de armas do agressor no âmbito da
    Lei Maria da Penha?
  resposta: Sinto muito que esteja passando por isso. A Lei Maria da Penha prevê medidas protetivas de
    urgência para garantir sua segurança. Uma delas é a suspensão da posse ou a restrição do porte de
    armas, caso o agressor as possua. O juiz pode determinar essa medida imediatamente se houver risco
    à sua integridade física. O objetivo é remover o instrumento que pode ser usado para ameaçar ou ferir
    você. Para solicitar essa e outras medidas, você pode procurar uma Delegacia da Mulher, o Ministério
    Público ou um defensor público. Você não está sozinha e existem caminhos legais para te proteger.
  trechos_fornecidos: []
  referencia:
  - n: 1
    fonte: Lei nº 11.340/2006 (Lei Maria da Penha), Art. 22 (parte 1/2)
    texto: 'Art. 22. Constatada a prática de violência doméstica e familiar contra a mulher, nos termos
      desta Lei, o juiz poderá aplicar, de imediato, ao agressor, em conjunto ou separadamente, as seguintes
      medidas protetivas de urgência, entre outras:

      I - suspensão da posse ou restrição do porte de armas, com comunicação ao órgão competente, nos
      termos da Lei nº 10.826, de 22 de dezembro de 2003 ;

      II - afastamento do lar, domicílio ou local de convivência com a ofendida;

      III - proibição de determinadas condutas, entre as quais:

      a) aproximação da ofendida, de seus familiares e das testemunhas, fixando o limite mínimo de distância
      entre estes e o agressor;

      b) contato com a ofendida, seus familiares e testemunhas por qualquer meio de comunicação;

      c) freqüentação de determinados lugares a fim de preservar a integridade física e psicológica da
      ofendida;

      IV - restrição ou suspensão de visitas aos dependentes menores, ouvida a equipe de atendimento multidisciplinar
      ou serviço similar;

      V - prestação de alimentos provisionais ou provisórios.

      VI – comparecimento do agressor a programas de recuperação e reeducação; e

      VII – acompanhamento psicossocial do agressor, por meio de atendimento individual e/ou em grupo
      de apoio.

      VIII – monitoração eletrônica, disponibilizando-se à vítima aplicação ou dispositivo de segurança
      que alerte sobre eventual aproximação do agressor.

      § 1º As medidas referidas neste artigo não impedem a aplicação de outras previstas na legislação
      em vigor, sempre que a segurança da ofendida ou as circunstâncias o exigirem, devendo a providência
      ser comunicada ao Ministério Público.

      § 2º Na hipótese de aplicação do inciso I, encontrando-se o agressor nas condições mencionadas no
      caput e incisos do art. 6º da Lei nº 10.826, de 22 de dezembro de 2003, o juiz comunicará ao respectivo
      órgão, corporação ou instituição as medidas protetivas de urgência concedidas e determinará a restrição
      do porte de armas, ficando o superior imediato do agressor responsável pelo cumprimento da determinação
      judicial, sob pena de incorrer nos crimes de prevaricação ou de desobediência, conforme o caso.

      § 3º Para garantir a efetividade das medidas protetivas de urgência, poderá o juiz requisitar, a
      qualquer momento, auxílio da força policial.

      § 4º Na aplicação das medidas protetivas de urgência, o juiz concederá a tutela específica ou determinará
      providências que assegurem a obtenção de tutela pelo resultado prático equivalente.'
  fiel: sim
  correcao: correta
  utilidade: 5
  comentario: ''
- item: j0296
  pergunta: Meu nome fica público ou pode ficar em sigilo?
  resposta: Sinto muito que você esteja passando por isso. Saiba que a lei brasileira busca proteger sua
    privacidade. Em casos de violência doméstica e familiar, o processo pode tramitar em segredo de justiça
    para preservar a sua intimidade e evitar a exposição. Isso significa que pessoas estranhas ao processo
    não terão acesso aos seus dados. Segundo a Lei Maria da Penha, os procedimentos devem ser sigilosos.
    Além disso, o Código de Processo Penal também prevê a proteção da identidade da vítima quando for
    necessário para garantir sua segurança e evitar constrangimentos. Busque o apoio de uma delegacia
    especializada ou da Defensoria Pública para solicitar formalmente que seus dados sejam mantidos em
    sigilo no processo.
  trechos_fornecidos: []
  referencia:
  - n: 1
    fonte: Lei nº 11.340/2006 (Lei Maria da Penha), Art. 9 (parte 2/2)
    texto: 'Art. 9º A assistência à mulher em situação de violência doméstica e familiar será prestada
      em caráter prioritário no Sistema Único de Saúde (SUS) e no Sistema Único de Segurança Pública (Susp),
      de forma articulada e conforme os princípios e as diretrizes previstos na Lei nº 8.742, de 7 de
      dezembro de 1993 (Lei Orgânica da Assistência Social), e em outras normas e políticas públicas de
      proteção, e emergencialmente, quando for o caso. (continuação)

      § 6º O ressarcimento de que tratam os §§ 4º e 5º deste artigo não poderá importar ônus de qualquer
      natureza ao patrimônio da mulher e dos seus dependentes, nem configurar atenuante ou ensejar possibilidade
      de substituição da pena aplicada.

      § 7º A mulher em situação de violência doméstica e familiar tem prioridade para matricular seus
      dependentes em instituição de educação básica mais próxima de seu domicílio, ou transferi-los para
      essa instituição, mediante a apresentação dos documentos comprobatórios do registro da ocorrência
      policial ou do processo de violência doméstica e familiar em curso.

      § 8º Serão sigilosos os dados da ofendida e de seus dependentes matriculados ou transferidos conforme
      o disposto no § 7º deste artigo, e o acesso às informações será reservado ao juiz, ao Ministério
      Público e aos órgãos competentes do poder público.'
  - n: 2
    fonte: Lei nº 11.340/2006 (Lei Maria da Penha), Art. 17-A
    texto: 'Art. 17-A. O nome da ofendida ficará sob sigilo nos processos em que se apuram crimes praticados
      no contexto de violência doméstica e familiar contra a mulher.

      Parágrafo único. O sigilo referido no caput deste artigo não abrange o nome do autor do fato, tampouco
      os demais dados do processo.'
  fiel: sim
  correcao: correta
  utilidade: 5
  comentario: ''
- item: j0384
  pergunta: Ontem discutindo ele me deu um soco muito forte no braço. Eu também xinguei ele, ele pode
    ser preso por ter me agradido?
  resposta: Sinto muito que você esteja passando por isso. O soco que você descreveu configura violência
    física, definida como qualquer conduta que ofenda sua integridade ou saúde corporal [1]. Sobre a possibilidade
    de prisão, a lei prevê que, em qualquer fase do inquérito policial ou do processo, o juiz pode decretar
    a prisão preventiva do agressor [2]. Além disso, se houver risco à sua integridade física, não será
    concedida liberdade provisória ao preso [3]. Os trechos consultados não trazem informações sobre como
    o fato de você ter xingado ele afeta a situação jurídica. Recomendo buscar orientação especializada
    para avaliar o seu caso específico.
  trechos_fornecidos:
  - n: 1
    fonte: Lei nº 11.340/2006 (Lei Maria da Penha), Art. 7, inciso I
    texto: 'Art. 7º São formas de violência doméstica e familiar contra a mulher, entre outras:

      I - a violência física, entendida como qualquer conduta que ofenda sua integridade ou saúde corporal;'
  - n: 2
    fonte: Lei nº 11.340/2006 (Lei Maria da Penha), Art. 20
    texto: 'Art. 20. Em qualquer fase do inquérito policial ou da instrução criminal, caberá a prisão
      preventiva do agressor, decretada pelo juiz, de ofício, a requerimento do Ministério Público ou
      mediante representação da autoridade policial.

      Parágrafo único. O juiz poderá revogar a prisão preventiva se, no curso do processo, verificar a
      falta de motivo para que subsista, bem como de novo decretá-la, se sobrevierem razões que a justifiquem.'
  - n: 3
    fonte: Lei nº 11.340/2006 (Lei Maria da Penha), Art. 12-C
    texto: 'Art. 12-C. Verificada a existência de risco atual ou iminente à vida ou à integridade física,
      sexual, psicológica, moral ou patrimonial da mulher em situação de violência doméstica e familiar,
      ou de seus dependentes, o agressor será imediatamente afastado do lar, domicílio ou local de convivência
      com a ofendida:

      I - pela autoridade judicial;

      II - pelo delegado de polícia, quando o Município não for sede de comarca; ou

      III - pelo policial, quando o Município não for sede de comarca e não houver delegado disponível
      no momento da denúncia.

      § 1º Nas hipóteses dos incisos II e III do caput deste artigo, o juiz será comunicado no prazo máximo
      de 24 (vinte e quatro) horas e decidirá, em igual prazo, sobre a manutenção ou a revogação da medida
      aplicada, devendo dar ciência ao Ministério Público concomitantemente.

      § 2º Nos casos de risco à integridade física da ofendida ou à efetividade da medida protetiva de
      urgência, não será concedida liberdade provisória ao preso.'
  - n: 4
    fonte: Lei nº 11.340/2006 (Lei Maria da Penha), Art. 21
    texto: 'Art. 21. A ofendida deverá ser notificada dos atos processuais relativos ao agressor, especialmente
      dos pertinentes ao ingresso e à saída da prisão, sem prejuízo da intimação do advogado constituído
      ou do defensor público.

      Parágrafo único. A ofendida não poderá entregar intimação ou notificação ao agressor .'
  - n: 5
