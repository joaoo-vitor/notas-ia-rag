- item: j0294
  pergunta: Ele fica me seguindo quando saio de casa, estou com medo
  resposta: Sinto muito que você esteja passando por isso. A perseguição constante e a vigilância que
    visam controlar suas ações e limitar seu direito de ir e vir são consideradas formas de violência
    psicológica contra a mulher [1]. Além disso, a lei classifica como crime a perseguição reiterada que
    invada ou perturbe sua liberdade ou privacidade, restringindo sua capacidade de locomoção [2]. O dano
    emocional que visa controlar seus comportamentos também é reconhecido como violência psicológica [3].
    É importante saber que o crime de perseguição só se inicia mediante representação [2].
  trechos_fornecidos:
  - n: 1
    fonte: Lei nº 11.340/2006 (Lei Maria da Penha), Art. 7, inciso II
    texto: 'Art. 7º São formas de violência doméstica e familiar contra a mulher, entre outras:

      II - a violência psicológica, entendida como qualquer conduta que lhe cause dano emocional e diminuição
      da autoestima ou que lhe prejudique e perturbe o pleno desenvolvimento ou que vise degradar ou controlar
      suas ações, comportamentos, crenças e decisões, mediante ameaça, constrangimento, humilhação, manipulação,
      isolamento, vigilância constante, perseguição contumaz, insulto, chantagem, violação de sua intimidade,
      ridicularização, exploração e limitação do direito de ir e vir ou qualquer outro meio que lhe cause
      prejuízo à saúde psicológica e à autodeterminação;'
  - n: 2
    fonte: Código Penal (Decreto-Lei nº 2.848/1940), Art. 147-A
    texto: 'Perseguição

      Art. 147-A. Perseguir alguém, reiteradamente e por qualquer meio, ameaçando-lhe a integridade física
      ou psicológica, restringindo-lhe a capacidade de locomoção ou, de qualquer forma, invadindo ou perturbando
      sua esfera de liberdade ou privacidade.

      Pena – reclusão, de 6 (seis) meses a 2 (dois) anos, e multa.

      § 1º A pena é aumentada de metade se o crime é cometido:

      I – contra criança, adolescente ou idoso;

      II – contra mulher por razões da condição de sexo feminino, nos termos do § 2º-A do art. 121 deste
      Código;

      III – mediante concurso de 2 (duas) ou mais pessoas ou com o emprego de arma.

      § 2º As penas deste artigo são aplicáveis sem prejuízo das correspondentes à violência.

      § 3º Somente se procede mediante representação.'
