    fonte: Pesquisa Pronta — aplicação da Lei Maria da Penha (STJ), Entendimento do STJ sobre pessoa agressora
      e mulher trans
    texto: 'DIREITO PENAL – VIOLÊNCIA DOMÉSTICA: A Lei Maria da Penha aplica-se à violência doméstica
      e familiar contra mulheres, inclusive mulheres trans, independentemente do gênero de quem pratica
      a agressão.'
  - n: 2
    fonte: Mandado de Injunção 7.452 — proteção em relações homoafetivas (STF), Decisão do STF no MI 7.452
    texto: O Supremo Tribunal Federal (STF) decidiu que a Lei Maria da Penha pode ser aplicada às relações
      afetivo-familiares de casais homoafetivos do sexo masculino ou que envolvam travestis e mulheres
      transexuais. Por unanimidade, o Plenário entendeu que há omissão do Congresso Nacional em legislar
      sobre a matéria.
