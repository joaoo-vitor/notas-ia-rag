    texto: 'Violência psicológica contra a mulher

      Art. 147-B. Causar dano emocional à mulher que a prejudique e perturbe seu pleno desenvolvimento
      ou que vise a degradar ou a controlar suas ações, comportamentos, crenças e decisões, mediante ameaça,
      constrangimento, humilhação, manipulação, isolamento, chantagem, ridicularização, limitação do direito
      de ir e vir ou qualquer outro meio que cause prejuízo à sua saúde psicológica e autodeterminação:

      Pena - reclusão, de 6 (seis) meses a 2 (dois) anos, e multa, se a conduta não constitui crime mais
      grave.

      Parágrafo único. A pena é aumentada de metade se o crime é cometido mediante uso de inteligência
      artificial ou de qualquer outro recurso tecnológico que altere imagem ou som da vítima.'
