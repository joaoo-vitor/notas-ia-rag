- item: j0264
  pergunta: Sofri agressões psicológicas e ameaças do meu parceiro há quase um ano. Na época fiquei em
    choque e não quis denunciar, mas agora me sinto pronta para buscar justiça. Perdi o direito de acionar
    a polícia criminalmente contra ele?
  resposta: Sinto muito que você tenha passado por isso. Sobre a sua dúvida, a lei estabelece que, nos
    crimes de violência doméstica e familiar, a mulher perde o direito de apresentar uma queixa ou representação
    contra o agressor se não o fizer dentro do prazo de 12 meses, contados a partir do dia em que soube
    quem foi o autor do crime [1]. Como você mencionou que as agressões ocorreram há quase um ano, é importante
    verificar com atenção se esse prazo de 12 meses já se encerrou ou não, pois isso determina a possibilidade
    de agir judicialmente pelo crime cometido [1].
  trechos_fornecidos:
  - n: 1
    fonte: Lei nº 11.340/2006 (Lei Maria da Penha), Art. 16-A
    texto: Art. 16-A. Nos crimes praticados no âmbito de violência doméstica e familiar contra a mulher,
      a ofendida decai do direito de queixa ou de representação se não o exerce no prazo de 12 (doze)
      meses, contado do dia em que veio a saber quem é o autor do crime, ou, no caso do § 3º do art. 100
      do Decreto-Lei nº 2.848, de 7 de dezembro de 1940 (Código Penal), do dia em que se esgota o prazo
      para oferecimento da denúncia.
  - n: 2
    fonte: Código Penal (Decreto-Lei nº 2.848/1940), Art. 129 (parte 1/2)
    texto: 'Lesão corporal

      Art. 129. Ofender a integridade corporal ou a saúde de outrem:

      Pena - detenção, de três meses a um ano.

      Lesão corporal de natureza grave

      § 1º Se resulta:

      I - Incapacidade para as ocupações habituais, por mais de trinta dias;

      II - perigo de vida;

      III - debilidade permanente de membro, sentido ou função;

      IV - aceleração de parto:

      Pena - reclusão, de um a cinco anos.

      § 2° Se resulta:

      I - Incapacidade permanente para o trabalho;

      II - enfermidade incuravel;

      III perda ou inutilização do membro, sentido ou função;

      IV - deformidade permanente;

      V - aborto:

      Pena - reclusão, de dois a oito anos.

      Lesão corporal seguida de morte

      § 3° Se resulta morte e as circunstâncias evidenciam que o agente não quís o resultado, nem assumiu
      o risco de produzí-lo:

      Pena - reclusão, de quatro a doze anos.

      § 3º-A. No crime previsto no § 3º deste artigo, se cometido no contexto da atuação ou para a consecução
      das condutas previstas no art. 2º da lei que institui o marco legal do combate ao crime organizado
      no Brasil:

      Pena - reclusão, de 20 (vinte) a 40 (quarenta) anos.

      Diminuição de pena

      § 4° Se o agente comete o crime impelido por motivo de relevante valor social ou moral ou sob o
      domínio de violenta emoção, logo em seguida a injusta provocação da vítima, o juiz pode reduzir
      a pena de um sexto a um terço.

      Substituição da pena

      § 5° O juiz, não sendo graves as lesões, pode ainda substituir a pena de detenção pela de multa,
      de duzentos mil réis a dois contos de réis:

      I - se ocorre qualquer das hipóteses do parágrafo anterior;

      II - se as lesões são recíprocas.

      Lesão corporal culposa

      § 6° Se a lesão é culposa:

      Pena - detenção, de dois meses a um ano.

      Aumento de pena

      § 7o Aumenta-se a pena de 1/3 (um terço) se ocorrer qualquer das hipóteses dos §§ 4o e 6o do art.
      121 deste Código.

      § 8º - Aplica-se à lesão culposa o disposto no § 5º do art. 121.

      § 8º-A. Com exceção do disposto no § 3º-A deste artigo, aumenta-se a pena em 2/3 (dois terços) se
      a lesão é praticada por integrante de organização criminosa ultraviolenta, grupo paramilitar ou
      milícia privada, no contexto da atuação ou para a consecução das condutas previstas no art. 2º da
      lei que institui o marco legal do combate ao crime organizado no Brasil.'
  - n: 3
    fonte: Lei nº 11.340/2006 (Lei Maria da Penha), Art. 20
    texto: 'Art. 20. Em qualquer fase do inquérito policial ou da instrução criminal, caberá a prisão
      preventiva do agressor, decretada pelo juiz, de ofício, a requerimento do Ministério Público ou
      mediante representação da autoridade policial.

      Parágrafo único. O juiz poderá revogar a prisão preventiva se, no curso do processo, verificar a
      falta de motivo para que subsista, bem como de novo decretá-la, se sobrevierem razões que a justifiquem.'
  - n: 4
    fonte: Código Penal (Decreto-Lei nº 2.848/1940), Art. 213
    texto: 'Estupro

      Art. 213. Constranger alguém, mediante violência ou grave ameaça, a ter conjunção carnal ou a praticar
      ou permitir que com ele se pratique outro ato libidinoso:

      Pena - reclusão, de 6 (seis) a 10 (dez) anos.

      § 1o Se da conduta resulta lesão corporal de natureza grave ou se a vítima é menor de 18 (dezoito)
      ou maior de 14 (catorze) anos:

      Pena - reclusão, de 8 (oito) a 12 (doze) anos.

      § 2o Se da conduta resulta morte:

      Pena - reclusão, de 12 (doze) a 30 (trinta) anos'
  - n: 5
    fonte: Pesquisa Pronta — aplicação da Lei Maria da Penha (STJ), Entendimento do STJ sobre pessoa agressora
      e mulher trans
    texto: 'DIREITO PENAL – VIOLÊNCIA DOMÉSTICA: A Lei Maria da Penha aplica-se à violência doméstica
      e familiar contra mulheres, inclusive mulheres trans, independentemente do gênero de quem pratica
      a agressão.'
  referencia:
  - n: 1
    fonte: Lei nº 11.340/2006 (Lei Maria da Penha), Art. 16-A
    texto: Art. 16-A. Nos crimes praticados no âmbito de violência doméstica e familiar contra a mulher,
      a ofendida decai do direito de queixa ou de representação se não o exerce no prazo de 12 (doze)
      meses, contado do dia em que veio a saber quem é o autor do crime, ou, no caso do § 3º do art. 100
      do Decreto-Lei nº 2.848, de 7 de dezembro de 1940 (Código Penal), do dia em que se esgota o prazo
      para oferecimento da denúncia.
  - n: 2
    fonte: Código Penal (Decreto-Lei nº 2.848/1940), Art. 147
    texto: 'Ameaça

      Art. 147 - Ameaçar alguém, por palavra, escrito ou gesto, ou qualquer outro meio simbólico, de causar-lhe
      mal injusto e grave:

      Pena - detenção, de um a seis meses, ou multa.

      § 1º Se o crime é cometido contra a mulher por razões da condição do sexo feminino, nos termos do
      § 1º do art. 121-A deste Código, aplica-se a pena em dobro.

      § 2º Somente se procede mediante representação, exceto na hipótese prevista no § 1º deste artigo.'
  fiel: sim
  correcao: correta
  utilidade: 5
  comentario: ''
- item: j0113
  pergunta: não tenho onde ficar se sair de casa tem algum lugar?
  resposta: Sinto muito que você esteja passando por isso. As leis indicam que o poder público pode criar
    casas-abrigo para acolher mulheres e seus dependentes em situação de violência doméstica [3]. Além
    disso, em casos de risco à sua vida ou integridade, a lei prevê que o agressor seja afastado do lar,
    domicílio ou local de convivência [5]. Profissionais capacitados em órgãos públicos também podem te
    encaminhar para o atendimento especializado disponível em sua localidade [2]. As leis consultadas
    não trazem uma lista específica de endereços ou nomes de abrigos, por isso não posso informar exatamente
    onde você pode ficar agora.
  trechos_fornecidos:
  - n: 1
    fonte: Lei nº 11.340/2006 (Lei Maria da Penha), Art. 15
    texto: 'Art. 15. É competente, por opção da ofendida, para os processos cíveis regidos por esta Lei,
      o Juizado:

      I - do seu domicílio ou de sua residência;

      II - do lugar do fato em que se baseou a demanda;

      III - do domicílio do agressor.'
  - n: 2
    fonte: Lei nº 14.188/2021 (Programa Sinal Vermelho), Art. 3
    texto: Art. 3º A identificação do código referido no parágrafo único do art. 2º desta Lei poderá ser
      feita pela vítima pessoalmente em repartições públicas e entidades privadas de todo o País e, para
      isso, deverão ser realizadas campanha informativa e capacitação permanente dos profissionais pertencentes
      ao programa, conforme dispõe o inciso VII do caput do art. 8º da Lei nº 11.340, de 7 de agosto de
      2006 (Lei Maria da Penha), para encaminhamento da vítima ao atendimento especializado na localidade.
  - n: 3
    fonte: Lei nº 11.340/2006 (Lei Maria da Penha), Art. 35
    texto: 'Art. 35. A União, o Distrito Federal, os Estados e os Municípios poderão criar e promover,
      no limite das respectivas competências:

      I - centros de atendimento integral e multidisciplinar para mulheres e respectivos dependentes em
      situação de violência doméstica e familiar;

      II - casas-abrigos para mulheres e respectivos dependentes menores em situação de violência doméstica
      e familiar;

      III - delegacias, núcleos de defensoria pública, serviços de saúde e centros de perícia médico-legal
      especializados no atendimento à mulher em situação de violência doméstica e familiar;

      IV - programas e campanhas de enfrentamento da violência doméstica e familiar;

      V - centros de educação e de reabilitação para os agressores.

      Parágrafo único. As campanhas a que se refere o inciso IV do caput deste artigo deverão contemplar
      informações sobre procedimentos e abordagens policiais, prevenção à revitimização, funcionamento
      das medidas protetivas de urgência e mecanismos de monitoração eletrônica.'
  - n: 4
    fonte: Código Penal (Decreto-Lei nº 2.848/1940), Art. 148
    texto: 'Seqüestro e cárcere privado

      Art. 148 - Privar alguém de sua liberdade, mediante seqüestro ou cárcere privado:

      Pena - reclusão, de um a três anos.

      § 1º - A pena é de reclusão, de dois a cinco anos:

      I – se a vítima é ascendente, descendente, cônjuge ou companheiro do agente ou maior de 60 (sessenta)
      anos;

      II - se o crime é praticado mediante internação da vítima em casa de saúde ou hospital;

      III - se a privação da liberdade dura mais de quinze dias.

      IV – se o crime é praticado contra menor de 18 (dezoito) anos;

      V – se o crime é praticado com fins libidinosos.

      § 2º - Se resulta à vítima, em razão de maus-tratos ou da natureza da detenção, grave sofrimento
      físico ou moral:

      Pena - reclusão, de dois a oito anos.

      § 3º Se cometido por integrante de organização criminosa ultraviolenta, grupo paramilitar ou milícia
      privada, no contexto da atuação ou para a consecução das condutas previstas no art. 2º da lei que
      institui o marco legal do combate ao crime organizado no Brasil:

      Pena - reclusão, de 12 (doze) a 20 (vinte) anos.'
  - n: 5
    fonte: Lei nº 11.340/2006 (Lei Maria da Penha), Art. 12-C
    texto: 'Art. 12-C. Verificada a existência de risco atual ou iminente à vida ou à integridade física,
      sexual, psicológica, moral ou patrimonial da mulher em situação de violência doméstica e familiar,
      ou de seus dependentes, o agressor será imediatamente afastado do lar, domicílio ou local de convivência
      com a ofendida:

      I - pela autoridade judicial;

      II - pelo delegado de polícia, quando o Município não for sede de comarca; ou

      III - pelo policial, quando o Município não for sede de comarca e não houver delegado disponível
      no momento da denúncia.

      § 1º Nas hipóteses dos incisos II e III do caput deste artigo, o juiz será comunicado no prazo máximo
      de 24 (vinte e quatro) horas e decidirá, em igual prazo, sobre a manutenção ou a revogação da medida
      aplicada, devendo dar ciência ao Ministério Público concomitantemente.

      § 2º Nos casos de risco à integridade física da ofendida ou à efetividade da medida protetiva de
      urgência, não será concedida liberdade provisória ao preso.'
  referencia:
  - n: 1
    fonte: Lei nº 11.340/2006 (Lei Maria da Penha), Art. 11
    texto: 'Art. 11. No atendimento à mulher em situação de violência doméstica e familiar, a autoridade
      policial deverá, entre outras providências:

      I - garantir proteção policial, quando necessário, comunicando de imediato ao Ministério Público
      e ao Poder Judiciário;

      II - encaminhar a ofendida ao hospital ou posto de saúde e ao Instituto Médico Legal;

      III - fornecer transporte para a ofendida e seus dependentes para abrigo ou local seguro, quando
      houver risco de vida;

      IV - se necessário, acompanhar a ofendida para assegurar a retirada de seus pertences do local da
      ocorrência ou do domicílio familiar;

      V - informar à ofendida os direitos a ela conferidos nesta Lei e os serviços disponíveis, inclusive
      os de assistência judiciária para o eventual ajuizamento perante o juízo competente da ação de separação
      judicial, de divórcio, de anulação de casamento ou de dissolução de união estável.

      Parágrafo único. Verificados indícios de redução a condição análoga à de escravo ou outra forma
      de violência doméstica contra a trabalhadora doméstica, a autoridade policial que tomar conhecimento
      da ocorrência deverá comunicá-la, em até 48 (quarenta e oito) horas, à unidade regional do Ministério
      do Trabalho e Emprego e ao Ministério Público do Trabalho.'
  - n: 2
    fonte: Lei nº 11.340/2006 (Lei Maria da Penha), Art. 23
    texto: 'Art. 23. Poderá o juiz, quando necessário, sem prejuízo de outras medidas:

      I - encaminhar a ofendida e seus dependentes a programa oficial ou comunitário de proteção ou de
