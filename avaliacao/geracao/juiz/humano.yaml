- item: j0109
  pergunta: ele disse q vai matar meus filhos se eu contar pra alguem o que ele fez cmg
  resposta: Sinto muito que você esteja passando por isso. Essa ameaça é gravíssima e configura violência
    psicológica e ameaça. A Lei Maria da Penha (Lei 11.340/2006, art. 7º, II) reconhece a violência psicológica
    como qualquer conduta que cause dano emocional ou diminuição da autoestima. Ameaçar seus filhos é
    uma forma de tentar te manter em silêncio. Você não precisa enfrentar isso sozinha. Procure a Delegacia
    da Mulher ou ligue para o 180, que é o número da Central de Atendimento à Mulher. Eles oferecem orientação
    gratuita e sigilosa sobre como se proteger e proteger seus filhos. Se o perigo for imediato, ligue
    para o 190 da Polícia Militar.
