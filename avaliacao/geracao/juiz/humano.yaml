- item: j0576
  pergunta: ele pegou meus documentos e não quer devolver
  resposta: Sinto muito que você esteja passando por isso. A retenção ou subtração dos seus documentos
    pessoais é considerada uma forma de violência patrimonial [1]. Para a proteção do seu patrimônio,
    o juiz pode determinar a restituição imediata dos bens que foram indevidamente retirados de você pelo
    agressor [5]. Além disso, o juiz possui outras medidas para proteger seus bens e direitos [5]. Os
    trechos consultados não informam onde você deve ir para solicitar essa medida de restituição ou quais
    passos específicos deve seguir para registrar o ocorrido.
  trechos_fornecidos:
  - n: 1
    fonte: Lei nº 11.340/2006 (Lei Maria da Penha), Art. 7, inciso IV
    texto: 'Art. 7º São formas de violência doméstica e familiar contra a mulher, entre outras:

      IV - a violência patrimonial, entendida como qualquer conduta que configure retenção, subtração,
      destruição parcial ou total de seus objetos, instrumentos de trabalho, documentos pessoais, bens,
      valores e direitos ou recursos econômicos, incluindo os destinados a satisfazer suas necessidades;'
  - n: 2
    fonte: Código Penal (Decreto-Lei nº 2.848/1940), Art. 181
    texto: 'Art. 181 - É isento de pena quem comete qualquer dos crimes previstos neste título, em prejuízo:

      I - do cônjuge, na constância da sociedade conjugal;

      II - de ascendente ou descendente, seja o parentesco legítimo ou ilegítimo, seja civil ou natural.'
  - n: 3
    fonte: Código Penal (Decreto-Lei nº 2.848/1940), Art. 215-A
    texto: 'Importunação sexual

      Art. 215-A. Praticar contra alguém e sem a sua anuência ato libidinoso com o objetivo de satisfazer
      a própria lascívia ou a de terceiro:

      Pena - reclusão, de 1 (um) a 5 (cinco) anos, se o ato não constitui crime mais grave.'
  - n: 4
    fonte: Código Penal (Decreto-Lei nº 2.848/1940), Art. 182
    texto: 'Art. 182 - Somente se procede mediante representação, se o crime previsto neste título é cometido
      em prejuízo:

      I - do cônjuge desquitado ou judicialmente separado;

      II - de irmão, legítimo ou ilegítimo;

      III - de tio ou sobrinho, com quem o agente coabita.'
  - n: 5
    fonte: Lei nº 11.340/2006 (Lei Maria da Penha), Art. 24
    texto: 'Art. 24. Para a proteção patrimonial dos bens da sociedade conjugal ou daqueles de propriedade
      particular da mulher, o juiz poderá determinar, liminarmente, as seguintes medidas, entre outras:

      I - restituição de bens indevidamente subtraídos pelo agressor à ofendida;

      II - proibição temporária para a celebração de atos e contratos de compra, venda e locação de propriedade
      em comum, salvo expressa autorização judicial;

      III - suspensão das procurações conferidas pela ofendida ao agressor;

      IV - prestação de caução provisória, mediante depósito judicial, por perdas e danos materiais decorrentes
      da prática de violência doméstica e familiar contra a ofendida.

      Parágrafo único. Deverá o juiz oficiar ao cartório competente para os fins previstos nos incisos
      II e III deste artigo.'
