- item: j0266
  pergunta: O que o ministerio publico faz em casos de violencia?
  resposta: O Ministério Público desempenha diversas funções para proteger mulheres em situação de violência.
    Ele pode solicitar força policial, serviços de saúde, educação e assistência social [1]. Além disso,
    cabe ao órgão fiscalizar locais de atendimento à mulher e tomar providências imediatas caso encontre
    irregularidades [1], bem como registrar os casos de violência [1]. O Ministério Público também atua
    defendendo direitos coletivos [3] e intervém em processos judiciais cíveis e criminais sobre violência
    doméstica, mesmo quando não é parte direta na ação [4]. Por fim, ele é informado pelo juiz sobre decisões
    relacionadas ao afastamento do agressor do lar [2].
  trechos_fornecidos:
  - n: 1
    fonte: Lei nº 11.340/2006 (Lei Maria da Penha), Art. 26
    texto: 'Art. 26. Caberá ao Ministério Público, sem prejuízo de outras atribuições, nos casos de violência
      doméstica e familiar contra a mulher, quando necessário:

      I - requisitar força policial e serviços públicos de saúde, de educação, de assistência social e
      de segurança, entre outros;

      II - fiscalizar os estabelecimentos públicos e particulares de atendimento à mulher em situação
      de violência doméstica e familiar, e adotar, de imediato, as medidas administrativas ou judiciais
      cabíveis no tocante a quaisquer irregularidades constatadas;

      III - cadastrar os casos de violência doméstica e familiar contra a mulher.'
