- item: j0385
  pergunta: eu vou ser avisada se ele for solto?
  resposta: Sim, você tem o direito de ser avisada sobre a saída do agressor da prisão [1]. A lei determina
    que a ofendida deve ser notificada sobre os atos processuais relacionados ao agressor, especialmente
    nos casos de entrada e saída da prisão, garantindo que você receba essas informações independentemente
    do seu advogado ou defensor público [1]. É importante lembrar que você nunca deve entregar pessoalmente
    qualquer intimação ou notificação ao agressor [1].
  trechos_fornecidos:
  - n: 1
    fonte: Lei nº 11.340/2006 (Lei Maria da Penha), Art. 21
    texto: 'Art. 21. A ofendida deverá ser notificada dos atos processuais relativos ao agressor, especialmente
      dos pertinentes ao ingresso e à saída da prisão, sem prejuízo da intimação do advogado constituído
      ou do defensor público.

      Parágrafo único. A ofendida não poderá entregar intimação ou notificação ao agressor .'
  - n: 2
    fonte: Lei nº 11.340/2006 (Lei Maria da Penha), Art. 22 (parte 2/2)
    texto: 'Art. 22. Constatada a prática de violência doméstica e familiar contra a mulher, nos termos
      desta Lei, o juiz poderá aplicar, de imediato, ao agressor, em conjunto ou separadamente, as seguintes
      medidas protetivas de urgência, entre outras: (continuação)

      § 6º A aplicação da medida prevista no inciso VIII do caput deste artigo terá prioridade nos casos
      em que houver descumprimento de medidas protetivas anteriormente impostas ou quando for verificado
      risco iminente à integridade física ou psicológica da vítima.

      § 7º Para a efetivação da medida prevista no inciso VIII do caput deste artigo, a autoridade competente
      promoverá a instalação do equipamento e instruirá o agressor sobre o seu funcionamento e as áreas
      de exclusão onde não poderá circular, conforme definido na decisão da autoridade judicial, devendo
      a ciência constar de termo nos autos.

      § 8º O sistema de monitoração eletrônica de que trata o inciso VIII do caput deste artigo deverá
      emitir alerta automático e simultâneo à vítima e à unidade policial mais próxima sempre que o agressor
      romper o perímetro de exclusão fixado judicialmente.

      § 9º Nos casos previstos no § 6º deste artigo, a decisão judicial que deixar de aplicar a medida
      protetiva de monitoração eletrônica deverá apresentar fundamentação expressa quanto às razões da
      não aplicação da medida.

      § 10 As medidas protetivas de natureza cível, inclusive as de prestação de alimentos provisionais
      ou provisórios, constituem título executivo judicial de pleno direito, dispensando a propositura
      de ação principal.'
