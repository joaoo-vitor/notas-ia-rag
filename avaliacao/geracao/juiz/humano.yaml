- item: j0220
  pergunta: Sou mulher trans, a lei vale para mim?
  resposta: Sim, a Lei Maria da Penha se aplica a mulheres trans em casos de violência doméstica e familiar
    [1]. O Supremo Tribunal Federal também confirmou que a lei pode ser aplicada em relações que envolvam
    mulheres transexuais e travestis [2].
  trechos_fornecidos:
