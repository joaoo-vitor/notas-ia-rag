- item: j0177
  pergunta: Ele não quer devolver meu celular, só se eu tiver relações sexuais com ele
  resposta: Sinto muito que você esteja passando por isso. A exigência de relações sexuais em troca de
    um bem pessoal, como o seu celular, é considerada uma forma de violência sexual, que ocorre quando
    alguém usa coação, chantagem ou manipulação para forçar uma relação sexual não desejada [2]. Além
    disso, o ato de reter ou subtrair seus objetos e bens pessoais caracteriza violência patrimonial [5].
    É importante saber que constranger alguém a ter relação sexual mediante grave ameaça ou força é um
    crime grave [1]. As leis consultadas não oferecem orientações sobre como recuperar o seu aparelho,
    tratando apenas da definição desses tipos de violência.
  trechos_fornecidos:
  - n: 1
    fonte: Código Penal (Decreto-Lei nº 2.848/1940), Art. 213
    texto: 'Estupro

      Art. 213. Constranger alguém, mediante violência ou grave ameaça, a ter conjunção carnal ou a praticar
      ou permitir que com ele se pratique outro ato libidinoso:

      Pena - reclusão, de 6 (seis) a 10 (dez) anos.

      § 1o Se da conduta resulta lesão corporal de natureza grave ou se a vítima é menor de 18 (dezoito)
      ou maior de 14 (catorze) anos:

      Pena - reclusão, de 8 (oito) a 12 (doze) anos.

      § 2o Se da conduta resulta morte:

      Pena - reclusão, de 12 (doze) a 30 (trinta) anos'
  - n: 2
    fonte: Lei nº 11.340/2006 (Lei Maria da Penha), Art. 7, inciso III
    texto: 'Art. 7º São formas de violência doméstica e familiar contra a mulher, entre outras:

      III - a violência sexual, entendida como qualquer conduta que a constranja a presenciar, a manter
      ou a participar de relação sexual não desejada, mediante intimidação, ameaça, coação ou uso da força;
      que a induza a comercializar ou a utilizar, de qualquer modo, a sua sexualidade, que a impeça de
      usar qualquer método contraceptivo ou que a force ao matrimônio, à gravidez, ao aborto ou à prostituição,
      mediante coação, chantagem, suborno ou manipulação; ou que limite ou anule o exercício de seus direitos
      sexuais e reprodutivos;'
  - n: 3
    fonte: Código Penal (Decreto-Lei nº 2.848/1940), Art. 215-A
    texto: 'Importunação sexual

      Art. 215-A. Praticar contra alguém e sem a sua anuência ato libidinoso com o objetivo de satisfazer
      a própria lascívia ou a de terceiro:

      Pena - reclusão, de 1 (um) a 5 (cinco) anos, se o ato não constitui crime mais grave.'
  - n: 4
    fonte: Código Penal (Decreto-Lei nº 2.848/1940), Art. 129 (parte 2/2)
    texto: 'Art. 129. Ofender a integridade corporal ou a saúde de outrem: (continuação)

      Violência Doméstica

      § 9º Se a lesão for praticada contra ascendente, descendente, irmão, cônjuge ou companheiro, pessoa
      com relação de trabalho doméstico ou com quem conviva ou tenha convivido, ou, ainda, prevalecendo-se
      o agente das relações domésticas, de trabalho doméstico, de coabitação ou de hospitalidade:

      Pena – reclusão, de 2 (dois) a 5 (cinco) anos.

      § 10. Nos casos previstos nos §§ 1o a 3o deste artigo, se as circunstâncias são as indicadas no
      § 9o deste artigo, aumenta-se a pena em 1/3 (um terço).

      § 11. Na hipótese do § 9o deste artigo, a pena será aumentada de um terço se o crime for cometido
      contra pessoa portadora de deficiência.

      § 12. Aumenta-se a pena de:

      I - 1/3 (um terço) a 2/3 (dois terços) se a lesão dolosa for praticada:

      a) contra autoridade ou agente descrito nos arts. 142 e 144 da Constituição Federal ou integrantes
      do sistema prisional ou da Força Nacional de Segurança Pública, no exercício da função ou em decorrência
      dela, ou contra seu cônjuge, companheiro ou parente consanguíneo até terceiro grau, em razão dessa
      condição;

      b) contra membro do Poder Judiciário, do Ministério Público, da Defensoria Pública ou da Advocacia
      Pública, de que tratam os arts. 131 e 132 da Constituição Federal, ou oficial de justiça, no exercício
      da função ou em decorrência dela, ou contra seu cônjuge, companheiro ou parente, inclusive por afinidade,
      até o terceiro grau, em razão dessa condição; ou

      c) nas dependências de instituição de ensino;

      II - 2/3 (dois terços) ao dobro se a lesão dolosa for praticada nas dependências de instituição
      de ensino e:

      a) a vítima for pessoa com deficiência ou com doença que acarrete condição limitante ou de vulnerabilidade
      física ou mental; ou

      b) o autor for ascendente, padrasto ou madrasta, tio, irmão, cônjuge, companheiro, tutor, curador,
      preceptor ou empregador da vítima ou por qualquer outro título tiver autoridade sobre ela ou, ainda,
      for professor ou funcionário da instituição de ensino.

      § 13. Se a lesão é praticada contra a mulher, por razões da condição do sexo feminino, nos termos
      do § 1º do art. 121-A deste Código:

      Pena – reclusão, de 2 (dois) a 5 (cinco) anos.'
  - n: 5
