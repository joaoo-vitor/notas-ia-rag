- item: j0353
  pergunta: a policia leva eu e meus filhos pra um abrigo?
  resposta: Sinto muito que você esteja passando por isso. Segundo a lei, a autoridade policial deve fornecer
    transporte para você e seus dependentes para um abrigo ou local seguro quando houver risco de vida
    [5]. Além disso, o juiz também pode determinar o seu encaminhamento para programas de proteção ou
    atendimento [2]. As leis mencionam que existem casas-abrigo destinadas a mulheres e seus dependentes
    menores em situação de violência [3]. As leis consultadas não detalham como é feito o funcionamento
    prático de solicitação de vagas em abrigos pela polícia, apenas estabelecem o dever de fornecer o
    transporte em caso de risco.
  trechos_fornecidos:
  - n: 1
    fonte: Lei nº 11.340/2006 (Lei Maria da Penha), Art. 12-B
    texto: 'Art. 12-B. (VETADO).

      § 3º A autoridade policial poderá requisitar os serviços públicos necessários à defesa da mulher
      em situação de violência doméstica e familiar e de seus dependentes.'
  - n: 2
    fonte: Lei nº 11.340/2006 (Lei Maria da Penha), Art. 23
    texto: 'Art. 23. Poderá o juiz, quando necessário, sem prejuízo de outras medidas:

      I - encaminhar a ofendida e seus dependentes a programa oficial ou comunitário de proteção ou de
      atendimento;

      II - determinar a recondução da ofendida e a de seus dependentes ao respectivo domicílio, após afastamento
      do agressor;

      III - determinar o afastamento da ofendida do lar, sem prejuízo dos direitos relativos a bens, guarda
      dos filhos e alimentos;

      IV - determinar a separação de corpos.

      V - determinar a matrícula dos dependentes da ofendida em instituição de educação básica mais próxima
      do seu domicílio, ou a transferência deles para essa instituição, independentemente da existência
      de vaga.

      VI – conceder à ofendida auxílio-aluguel, com valor fixado em função de sua situação de vulnerabilidade
      social e econômica, por período não superior a 6 (seis) meses.'
  - n: 3
    fonte: Lei nº 11.340/2006 (Lei Maria da Penha), Art. 35
    texto: 'Art. 35. A União, o Distrito Federal, os Estados e os Municípios poderão criar e promover,
      no limite das respectivas competências:

      I - centros de atendimento integral e multidisciplinar para mulheres e respectivos dependentes em
      situação de violência doméstica e familiar;

      II - casas-abrigos para mulheres e respectivos dependentes menores em situação de violência doméstica
      e familiar;

      III - delegacias, núcleos de defensoria pública, serviços de saúde e centros de perícia médico-legal
      especializados no atendimento à mulher em situação de violência doméstica e familiar;

      IV - programas e campanhas de enfrentamento da violência doméstica e familiar;

      V - centros de educação e de reabilitação para os agressores.

      Parágrafo único. As campanhas a que se refere o inciso IV do caput deste artigo deverão contemplar
      informações sobre procedimentos e abordagens policiais, prevenção à revitimização, funcionamento
      das medidas protetivas de urgência e mecanismos de monitoração eletrônica.'
  - n: 4
    fonte: Lei nº 11.340/2006 (Lei Maria da Penha), Art. 9 (parte 2/2)
    texto: 'Art. 9º A assistência à mulher em situação de violência doméstica e familiar será prestada
      em caráter prioritário no Sistema Único de Saúde (SUS) e no Sistema Único de Segurança Pública (Susp),
      de forma articulada e conforme os princípios e as diretrizes previstos na Lei nº 8.742, de 7 de
      dezembro de 1993 (Lei Orgânica da Assistência Social), e em outras normas e políticas públicas de
      proteção, e emergencialmente, quando for o caso. (continuação)

      § 6º O ressarcimento de que tratam os §§ 4º e 5º deste artigo não poderá importar ônus de qualquer
      natureza ao patrimônio da mulher e dos seus dependentes, nem configurar atenuante ou ensejar possibilidade
      de substituição da pena aplicada.

      § 7º A mulher em situação de violência doméstica e familiar tem prioridade para matricular seus
      dependentes em instituição de educação básica mais próxima de seu domicílio, ou transferi-los para
      essa instituição, mediante a apresentação dos documentos comprobatórios do registro da ocorrência
      policial ou do processo de violência doméstica e familiar em curso.

      § 8º Serão sigilosos os dados da ofendida e de seus dependentes matriculados ou transferidos conforme
      o disposto no § 7º deste artigo, e o acesso às informações será reservado ao juiz, ao Ministério
      Público e aos órgãos competentes do poder público.'
  - n: 5
    fonte: Lei nº 11.340/2006 (Lei Maria da Penha), Art. 11
    texto: 'Art. 11. No atendimento à mulher em situação de violência doméstica e familiar, a autoridade
      policial deverá, entre outras providências:

      I - garantir proteção policial, quando necessário, comunicando de imediato ao Ministério Público
      e ao Poder Judiciário;

      II - encaminhar a ofendida ao hospital ou posto de saúde e ao Instituto Médico Legal;

      III - fornecer transporte para a ofendida e seus dependentes para abrigo ou local seguro, quando
      houver risco de vida;

      IV - se necessário, acompanhar a ofendida para assegurar a retirada de seus pertences do local da
      ocorrência ou do domicílio familiar;

      V - informar à ofendida os direitos a ela conferidos nesta Lei e os serviços disponíveis, inclusive
      os de assistência judiciária para o eventual ajuizamento perante o juízo competente da ação de separação
      judicial, de divórcio, de anulação de casamento ou de dissolução de união estável.

      Parágrafo único. Verificados indícios de redução a condição análoga à de escravo ou outra forma
      de violência doméstica contra a trabalhadora doméstica, a autoridade policial que tomar conhecimento
      da ocorrência deverá comunicá-la, em até 48 (quarenta e oito) horas, à unidade regional do Ministério
      do Trabalho e Emprego e ao Ministério Público do Trabalho.'
  referencia:
