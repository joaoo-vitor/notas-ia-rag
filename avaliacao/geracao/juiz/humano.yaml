- item: j0032
  pergunta: O irmão do meu marido me deu um soco ontem, isso é violência doméstica?
  resposta: Sinto muito pelo que você está passando. A violência física é definida como qualquer conduta
    que ofenda a integridade ou a saúde corporal da mulher [1]. A violência doméstica e familiar pode
    ocorrer no âmbito da família, que é a comunidade formada por indivíduos que se consideram aparentados,
    unidos por laços naturais ou por afinidade [2]. Como o agressor é irmão do seu marido, ele possui
    uma relação de afinidade com você dentro do contexto familiar, o que se enquadra na proteção da lei
    contra a violência doméstica e familiar [2].
  trechos_fornecidos:
  - n: 1
    fonte: Lei nº 11.340/2006 (Lei Maria da Penha), Art. 7, inciso I
    texto: 'Art. 7º São formas de violência doméstica e familiar contra a mulher, entre outras:

      I - a violência física, entendida como qualquer conduta que ofenda sua integridade ou saúde corporal;'
  - n: 2
    fonte: Lei nº 11.340/2006 (Lei Maria da Penha), Art. 5
    texto: 'Art. 5º Para os efeitos desta Lei, configura violência doméstica e familiar contra a mulher
      qualquer ação ou omissão baseada no gênero que lhe cause morte, lesão, sofrimento físico, sexual
      ou psicológico e dano moral ou patrimonial:

      I - no âmbito da unidade doméstica, compreendida como o espaço de convívio permanente de pessoas,
      com ou sem vínculo familiar, inclusive as esporadicamente agregadas;

      II - no âmbito da família, compreendida como a comunidade formada por indivíduos que são ou se consideram
      aparentados, unidos por laços naturais, por afinidade ou por vontade expressa;

      III - em qualquer relação íntima de afeto, na qual o agressor conviva ou tenha convivido com a ofendida,
      independentemente de coabitação.

      Parágrafo único. As relações pessoais enunciadas neste artigo independem de orientação sexual.'
  - n: 3
    fonte: Código Penal (Decreto-Lei nº 2.848/1940), Art. 129 (parte 2/2)
    texto: 'Art. 129. Ofender a integridade corporal ou a saúde de outrem: (continuação)

      Violência Doméstica

      § 9º Se a lesão for praticada contra ascendente, descendente, irmão, cônjuge ou companheiro, pessoa
      com relação de trabalho doméstico ou com quem conviva ou tenha convivido, ou, ainda, prevalecendo-se
      o agente das relações domésticas, de trabalho doméstico, de coabitação ou de hospitalidade:

      Pena – reclusão, de 2 (dois) a 5 (cinco) anos.

      § 10. Nos casos previstos nos §§ 1o a 3o deste artigo, se as circunstâncias são as indicadas no
      § 9o deste artigo, aumenta-se a pena em 1/3 (um terço).

      § 11. Na hipótese do § 9o deste artigo, a pena será aumentada de um terço se o crime for cometido
      contra pessoa portadora de deficiência.

      § 12. Aumenta-se a pena de:

      I - 1/3 (um terço) a 2/3 (dois terços) se a lesão dolosa for praticada:

      a) contra autoridade ou agente descrito nos arts. 142 e 144 da Constituição Federal ou integrantes
      do sistema prisional ou da Força Nacional de Segurança Pública, no exercício da função ou em decorrência
      dela, ou contra seu cônjuge, companheiro ou parente consanguíneo até terceiro grau, em razão dessa
      condição;

      b) contra membro do Poder Judiciário, do Ministério Público, da Defensoria Pública ou da Advocacia
      Pública, de que tratam os arts. 131 e 132 da Constituição Federal, ou oficial de justiça, no exercício
      da função ou em decorrência dela, ou contra seu cônjuge, companheiro ou parente, inclusive por afinidade,
      até o terceiro grau, em razão dessa condição; ou

      c) nas dependências de instituição de ensino;

      II - 2/3 (dois terços) ao dobro se a lesão dolosa for praticada nas dependências de instituição
      de ensino e:

      a) a vítima for pessoa com deficiência ou com doença que acarrete condição limitante ou de vulnerabilidade
      física ou mental; ou

      b) o autor for ascendente, padrasto ou madrasta, tio, irmão, cônjuge, companheiro, tutor, curador,
      preceptor ou empregador da vítima ou por qualquer outro título tiver autoridade sobre ela ou, ainda,
      for professor ou funcionário da instituição de ensino.

      § 13. Se a lesão é praticada contra a mulher, por razões da condição do sexo feminino, nos termos
      do § 1º do art. 121-A deste Código:

      Pena – reclusão, de 2 (dois) a 5 (cinco) anos.'
  - n: 4
    fonte: Lei nº 11.340/2006 (Lei Maria da Penha), Art. 6
    texto: Art. 6º A violência doméstica e familiar contra a mulher constitui uma das formas de violação
      dos direitos humanos.
  - n: 5
    fonte: Código Penal (Decreto-Lei nº 2.848/1940), Art. 182
    texto: 'Art. 182 - Somente se procede mediante representação, se o crime previsto neste título é cometido
      em prejuízo:

      I - do cônjuge desquitado ou judicialmente separado;

      II - de irmão, legítimo ou ilegítimo;

      III - de tio ou sobrinho, com quem o agente coabita.'
  referencia:
  - n: 1
