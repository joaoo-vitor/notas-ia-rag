- item: j0422
  pergunta: Que atendimento de saúde posso receber depois de sofrer violência sexual?
  resposta: Sinto muito pelo que você está passando. Saiba que a assistência à mulher em situação de violência
    é prioritária no Sistema Único de Saúde (SUS) [1]. Em casos de violência sexual, você tem direito
    ao acesso a serviços de contracepção de emergência e à profilaxia das Doenças Sexualmente Transmissíveis
    (DST) e da AIDS [1]. Além disso, você tem direito a outros procedimentos médicos necessários e cabíveis
    para o seu cuidado [1].
