- item: j0398
  pergunta: Quais são as causas de aumento de pena aplicáveis ao crime de descumprimento de medida protetiva?
  resposta: 'A pena pelo descumprimento de uma medida protetiva de urgência pode ser aumentada de um terço
    até a metade se esse descumprimento ocorrer em duas situações: caso você tenha áreas de exclusão monitoradas
    eletronicamente ou se houver remoção, violação ou alteração do dispositivo de monitoração sem autorização
    da justiça [4].'
  trechos_fornecidos:
  - n: 1
    fonte: Lei nº 11.340/2006 (Lei Maria da Penha), Art. 24-A
    texto: 'Descumprimento de Medidas Protetivas de Urgência

      Art. 24-A. Descumprir decisão judicial que defere medidas protetivas de urgência previstas nesta
      Lei:

      Pena – reclusão, de 2 (dois) a 5 (cinco) anos, e multa.

      § 1º A configuração do crime independe da competência civil ou criminal do juiz que deferiu as medidas.

      § 2º Na hipótese de prisão em flagrante, apenas a autoridade judicial poderá conceder fiança.

      § 3º O disposto neste artigo não exclui a aplicação de outras sanções cabíveis.

      § 4º A pena será aumentada de 1/3 (um terço) até a metade se o descumprimento decorrer da violação
      das áreas de exclusão monitoradas eletronicamente ou da remoção, violação ou alteração do dispositivo
      de monitoração sem autorização judicial.'
