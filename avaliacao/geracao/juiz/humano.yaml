- item: j0139
  pergunta: Sofri agressões psicológicas e ameaças do meu parceiro há quase um ano. Na época fiquei em
    choque e não quis denunciar, mas agora me sinto pronta para buscar justiça. Perdi o direito de acionar
    a polícia criminalmente contra ele?
  resposta: Sinto muito que você tenha passado por isso. Sobre sua dúvida, a lei estabelece que, nos casos
    em que é necessária a representação, a mulher perde o direito de apresentar queixa se não o fizer
    no prazo de 12 meses, contados a partir do dia em que soube quem foi o autor do crime [1]. Como você
    mencionou que o ocorrido foi há quase um ano, é importante verificar se esse prazo de 12 meses já
    se esgotou em relação ao conhecimento da autoria do fato. As leis consultadas não especificam outros
    prazos para denúncias que não dependam de representação, portanto, recomendo buscar orientação especializada
    para analisar seu caso específico.
  trechos_fornecidos:
  - n: 1
    fonte: Lei nº 11.340/2006 (Lei Maria da Penha), Art. 16-A
    texto: Art. 16-A. Nos crimes praticados no âmbito de violência doméstica e familiar contra a mulher,
      a ofendida decai do direito de queixa ou de representação se não o exerce no prazo de 12 (doze)
      meses, contado do dia em que veio a saber quem é o autor do crime, ou, no caso do § 3º do art. 100
      do Decreto-Lei nº 2.848, de 7 de dezembro de 1940 (Código Penal), do dia em que se esgota o prazo
      para oferecimento da denúncia.
  - n: 2
    fonte: Lei nº 11.340/2006 (Lei Maria da Penha), Art. 12-C
    texto: 'Art. 12-C. Verificada a existência de risco atual ou iminente à vida ou à integridade física,
      sexual, psicológica, moral ou patrimonial da mulher em situação de violência doméstica e familiar,
      ou de seus dependentes, o agressor será imediatamente afastado do lar, domicílio ou local de convivência
      com a ofendida:

      I - pela autoridade judicial;

      II - pelo delegado de polícia, quando o Município não for sede de comarca; ou

      III - pelo policial, quando o Município não for sede de comarca e não houver delegado disponível
      no momento da denúncia.

      § 1º Nas hipóteses dos incisos II e III do caput deste artigo, o juiz será comunicado no prazo máximo
      de 24 (vinte e quatro) horas e decidirá, em igual prazo, sobre a manutenção ou a revogação da medida
      aplicada, devendo dar ciência ao Ministério Público concomitantemente.

      § 2º Nos casos de risco à integridade física da ofendida ou à efetividade da medida protetiva de
      urgência, não será concedida liberdade provisória ao preso.'
  - n: 3
    fonte: Lei nº 11.340/2006 (Lei Maria da Penha), Art. 12-B
    texto: 'Art. 12-B. (VETADO).

      § 3º A autoridade policial poderá requisitar os serviços públicos necessários à defesa da mulher
      em situação de violência doméstica e familiar e de seus dependentes.'
  - n: 4
    fonte: Código Penal (Decreto-Lei nº 2.848/1940), Art. 147
    texto: 'Ameaça

      Art. 147 - Ameaçar alguém, por palavra, escrito ou gesto, ou qualquer outro meio simbólico, de causar-lhe
      mal injusto e grave:

      Pena - detenção, de um a seis meses, ou multa.

      § 1º Se o crime é cometido contra a mulher por razões da condição do sexo feminino, nos termos do
      § 1º do art. 121-A deste Código, aplica-se a pena em dobro.

      § 2º Somente se procede mediante representação, exceto na hipótese prevista no § 1º deste artigo.'
  - n: 5
    fonte: Lei nº 11.340/2006 (Lei Maria da Penha), Art. 11
    texto: 'Art. 11. No atendimento à mulher em situação de violência doméstica e familiar, a autoridade
      policial deverá, entre outras providências:

      I - garantir proteção policial, quando necessário, comunicando de imediato ao Ministério Público
      e ao Poder Judiciário;

      II - encaminhar a ofendida ao hospital ou posto de saúde e ao Instituto Médico Legal;

      III - fornecer transporte para a ofendida e seus dependentes para abrigo ou local seguro, quando
      houver risco de vida;

      IV - se necessário, acompanhar a ofendida para assegurar a retirada de seus pertences do local da
      ocorrência ou do domicílio familiar;

      V - informar à ofendida os direitos a ela conferidos nesta Lei e os serviços disponíveis, inclusive
      os de assistência judiciária para o eventual ajuizamento perante o juízo competente da ação de separação
      judicial, de divórcio, de anulação de casamento ou de dissolução de união estável.

      Parágrafo único. Verificados indícios de redução a condição análoga à de escravo ou outra forma
      de violência doméstica contra a trabalhadora doméstica, a autoridade policial que tomar conhecimento
      da ocorrência deverá comunicá-la, em até 48 (quarenta e oito) horas, à unidade regional do Ministério
      do Trabalho e Emprego e ao Ministério Público do Trabalho.'
