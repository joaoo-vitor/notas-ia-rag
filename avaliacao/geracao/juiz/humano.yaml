- item: j0087
  pergunta: O papel do hospital de quando fui machucada pode servir como prova?
  resposta: Sinto muito que você esteja passando por isso. Segundo a lei, laudos ou prontuários médicos
    fornecidos por hospitais e postos de saúde são admitidos como meios de prova em casos de violência
    doméstica e familiar contra a mulher [3]. Além disso, a autoridade policial deve colher todas as provas
    que ajudem a esclarecer o que aconteceu [1] e anexar aos documentos do inquérito cópias de todos os
    documentos que você já possuir [1].
  trechos_fornecidos:
  - n: 1
    fonte: Lei nº 11.340/2006 (Lei Maria da Penha), Art. 12
    texto: 'Art. 12. Em todos os casos de violência doméstica e familiar contra a mulher, feito o registro
      da ocorrência, deverá a autoridade policial adotar, de imediato, os seguintes procedimentos, sem
      prejuízo daqueles previstos no Código de Processo Penal:

      I - ouvir a ofendida, lavrar o boletim de ocorrência e tomar a representação a termo, se apresentada;

      II - colher todas as provas que servirem para o esclarecimento do fato e de suas circunstâncias;

      III - remeter, no prazo de 48 (quarenta e oito) horas, expediente apartado ao juiz com o pedido
      da ofendida, para a concessão de medidas protetivas de urgência;

      IV - determinar que se proceda ao exame de corpo de delito da ofendida e requisitar outros exames
      periciais necessários;

      V - ouvir o agressor e as testemunhas;

      VI - ordenar a identificação do agressor e fazer juntar aos autos sua folha de antecedentes criminais,
      indicando a existência de mandado de prisão ou registro de outras ocorrências policiais contra ele;

      VI-A - verificar se o agressor possui registro de porte ou posse de arma de fogo e, na hipótese
      de existência, juntar aos autos essa informação, bem como notificar a ocorrência à instituição responsável
      pela concessão do registro ou da emissão do porte, nos termos da Lei nº 10.826, de 22 de dezembro
      de 2003 (Estatuto do Desarmamento);

      VII - remeter, no prazo legal, os autos do inquérito policial ao juiz e ao Ministério Público.

      § 1º O pedido da ofendida será tomado a termo pela autoridade policial e deverá conter:

      I - qualificação da ofendida e do agressor;

      II - nome e idade dos dependentes;

      III - descrição sucinta do fato e das medidas protetivas solicitadas pela ofendida.

      IV - informação sobre a condição de a ofendida ser pessoa com deficiência e se da violência sofrida
      resultou deficiência ou agravamento de deficiência preexistente.

      § 2º A autoridade policial deverá anexar ao documento referido no § 1º o boletim de ocorrência e
      cópia de todos os documentos disponíveis em posse da ofendida.

      § 3º Serão admitidos como meios de prova os laudos ou prontuários médicos fornecidos por hospitais
      e postos de saúde.'
  referencia:
  - n: 1
