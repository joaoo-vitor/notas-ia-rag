- item: j0424
  pergunta: ele ameaçou me matar
  resposta: Sinto muito que você esteja passando por isso. A ameaça de causar mal injusto e grave a alguém
    é crime [4]. Quando esse crime é cometido contra a mulher por razões da condição do sexo feminino,
    como em situações de violência doméstica e familiar, a pena prevista para o autor é aplicada em dobro
    [4]. Além disso, nesses casos específicos de violência contra a mulher, o procedimento não depende
    de representação da vítima para dar início à apuração [4].
  trechos_fornecidos:
  - n: 1
    fonte: Código Penal (Decreto-Lei nº 2.848/1940), Art. 121 (parte 1/2)
    texto: 'Homicídio simples

      Art. 121. Matar alguem:

      Pena - reclusão, de seis a vinte anos.

      Caso de diminuição de pena

      § 1º Se o agente comete o crime impelido por motivo de relevante valor social ou moral, ou sob o
      domínio de violenta emoção, logo em seguida a injusta provocação da vítima, o juiz pode reduzir
      a pena de um sexto a um terço.

      Homicídio qualificado

      § 2° Se o homicídio é cometido:

      I - mediante paga ou promessa de recompensa, ou por outro motivo torpe;

      II - por motivo futil;

      III - com emprego de veneno, fogo, explosivo, asfixia, tortura ou outro meio insidioso ou cruel,
      ou de que possa resultar perigo comum;

      IV - à traição, de emboscada, ou mediante dissimulação ou outro recurso que dificulte ou torne impossivel
      a defesa do ofendido;

      V - para assegurar a execução, a ocultação, a impunidade ou vantagem de outro crime:

      Pena - reclusão, de doze a trinta anos.

      Feminicídio

      VII – contra:

      a) autoridade ou agente descrito nos arts. 142 e 144 da Constituição Federal, integrantes do sistema
      prisional e da Força Nacional de Segurança Pública, no exercício da função ou em decorrência dela,
      ou contra seu cônjuge, companheiro ou parente consanguíneo até o terceiro grau, em razão dessa condição;

      b) membro do Poder Judiciário, do Ministério Público, da Defensoria Pública ou da Advocacia Pública,
      de que tratam os arts. 131 e 132 da Constituição Federal, ou oficial de justiça, no exercício da
      função ou em decorrência dela, ou contra seu cônjuge, companheiro ou parente, inclusive por afinidade,
      até o terceiro grau, em razão dessa condição;

      VIII - com emprego de arma de fogo de uso restrito ou proibido:

      Homicídio contra menor de 14 (quatorze) anos Vigência

      IX - contra menor de 14 (quatorze) anos: Vigência

      X - nas dependências de instituição de ensino:

      Pena - reclusão, de doze a trinta anos.

      § 2o-A

      § 2º-B. A pena do homicídio contra menor de 14 (quatorze) anos é aumentada de: Vigência

      I - 1/3 (um terço) até a metade se a vítima é pessoa com deficiência ou com doença que implique
      o aumento de sua vulnerabilidade; Vigência

      II - 2/3 (dois terços) se o autor é ascendente, padrasto ou madrasta, tio, irmão, cônjuge, companheiro,
      tutor, curador, preceptor ou empregador da vítima ou por qualquer outro título tiver autoridade
      sobre ela. Vigência

      III - 2/3 (dois terços) se o crime for praticado em instituição de educação básica pública ou privada.

      § 2º-C. A pena do homicídio cometido nas dependências de instituição de ensino é aumentada de:'
  - n: 2
    fonte: Código Penal (Decreto-Lei nº 2.848/1940), Art. 121-A
    texto: 'Feminicídio

      Art. 121-A. Matar mulher por razões da condição do sexo feminino:

      Pena – reclusão, de 20 (vinte) a 40 (quarenta) anos.

      § 1º Considera-se que há razões da condição do sexo feminino quando o crime envolve:

      I – violência doméstica e familiar;

      II – menosprezo ou discriminação à condição de mulher.

      § 2º A pena do feminicídio é aumentada de 1/3 (um terço) até a metade se o crime é praticado:

      I – durante a gestação, nos 3 (três) meses posteriores ao parto ou se a vítima é a mãe ou a responsável
      por criança, adolescente ou pessoa com deficiência de qualquer idade;

      II – contra pessoa menor de 14 (catorze) anos, maior de 60 (sessenta) anos, com deficiência ou portadora
      de doenças degenerativas que acarretem condição limitante ou de vulnerabilidade física ou mental;

      III – na presença física ou virtual de descendente ou de ascendente da vítima;

      IV – em descumprimento das medidas protetivas de urgência previstas nos incisos I, II e III do caput
      do art. 22 da Lei nº 11.340, de 7 de agosto de 2006 (Lei Maria da Penha);

      V – nas circunstâncias previstas nos incisos III, IV e VIII do § 2º do art. 121 deste Código.

      Coautoria

      § 3º Comunicam-se ao coautor ou partícipe as circunstâncias pessoais elementares do crime previstas
      no § 1º deste artigo.'
  - n: 3
    fonte: Código Penal (Decreto-Lei nº 2.848/1940), Art. 121 (parte 2/2)
    texto: 'Art. 121. Matar alguem: (continuação)

      I - 1/3 (um terço) até a metade se a vítima é pessoa com deficiência ou com doença que acarrete
      condição limitante ou de vulnerabilidade física ou mental;

      II - 2/3 (dois terços) se o autor é ascendente, padrasto ou madrasta, tio, irmão, cônjuge, companheiro,
      tutor, curador, preceptor ou empregador da vítima ou por qualquer outro título tem autoridade sobre
      ela ou, ainda, se é professor ou funcionário da instituição de ensino.

      § 2º-D. Se o homicídio doloso é cometido por integrante de organização criminosa ultraviolenta,
      grupo paramilitar ou milícia privada, no contexto da atuação ou para a consecução das condutas previstas
      no art. 2º da lei que institui o marco legal do combate ao crime organizado no Brasil.

      Pena - reclusão, de 20 (vinte) a 40 (quarenta anos).

      Homicídio culposo

      § 3º Se o homicídio é culposo:

      Pena - detenção, de um a três anos.

      Aumento de pena

      § 4o No homicídio culposo, a pena é aumentada de 1/3 (um terço), se o crime resulta de inobservância
      de regra técnica de profissão, arte ou ofício, ou se o agente deixa de prestar imediato socorro
      à vítima, não procura diminuir as conseqüências do seu ato, ou foge para evitar prisão em flagrante.
      Sendo doloso o homicídio, a pena é aumentada de 1/3 (um terço) se o crime é praticado contra pessoa
      menor de 14 (quatorze) ou maior de 60 (sessenta) anos.

      § 5º - Na hipótese de homicídio culposo, o juiz poderá deixar de aplicar a pena, se as conseqüências
      da infração atingirem o próprio agente de forma tão grave que a sanção penal se torne desnecessária.

      § 6o A pena é aumentada de 1/3 (um terço) até a metade se o crime for praticado por milícia privada,
      sob o pretexto de prestação de serviço de segurança, ou por grupo de extermínio.'
  - n: 4
    fonte: Código Penal (Decreto-Lei nº 2.848/1940), Art. 147
    texto: 'Ameaça

      Art. 147 - Ameaçar alguém, por palavra, escrito ou gesto, ou qualquer outro meio simbólico, de causar-lhe
      mal injusto e grave:

      Pena - detenção, de um a seis meses, ou multa.

      § 1º Se o crime é cometido contra a mulher por razões da condição do sexo feminino, nos termos do
      § 1º do art. 121-A deste Código, aplica-se a pena em dobro.

      § 2º Somente se procede mediante representação, exceto na hipótese prevista no § 1º deste artigo.'
  - n: 5
    fonte: Código Penal (Decreto-Lei nº 2.848/1940), Art. 183
    texto: 'Art. 183 - Não se aplica o disposto nos dois artigos anteriores:

      I - se o crime é de roubo ou de extorsão, ou, em geral, quando haja emprego de grave ameaça ou violência
      à pessoa;

      II - ao estranho que participa do crime.

      III – se o crime é praticado contra pessoa com idade igual ou superior a 60 (sessenta) anos.'
  referencia:
  - n: 1
    fonte: Código Penal (Decreto-Lei nº 2.848/1940), Art. 147
    texto: 'Ameaça

      Art. 147 - Ameaçar alguém, por palavra, escrito ou gesto, ou qualquer outro meio simbólico, de causar-lhe
      mal injusto e grave:

      Pena - detenção, de um a seis meses, ou multa.

      § 1º Se o crime é cometido contra a mulher por razões da condição do sexo feminino, nos termos do
      § 1º do art. 121-A deste Código, aplica-se a pena em dobro.

      § 2º Somente se procede mediante representação, exceto na hipótese prevista no § 1º deste artigo.'
  fiel: não
  correcao: correta
  utilidade: 5
  comentario: ''
- item: j0423
  pergunta: Ele têm me perseguido bastante. Vejo ele em tudo que é lugar. Devo chamar polícia?
  resposta: Sinto muito que você esteja passando por isso. A perseguição insistente, conhecida como 'stalking',
    é crime no Brasil. A Lei 14.132/2021 alterou o Código Penal para punir quem persegue alguém reiteradamente,
    ameaçando sua integridade física ou psicológica e restringindo sua capacidade de locomoção. Se você
    se sente em perigo ou está sendo vigiada, é fundamental buscar ajuda. Você pode ligar para o 190 se
    estiver em uma situação de emergência agora ou procurar uma Delegacia da Mulher para registrar um
    boletim de ocorrência. O Ligue 180 também oferece orientações gratuitas e confidenciais sobre onde
    buscar proteção e apoio na sua região.
  trechos_fornecidos: []
  referencia:
  - n: 1
    fonte: Lei nº 11.340/2006 (Lei Maria da Penha), Art. 7, inciso II
    texto: 'Art. 7º São formas de violência doméstica e familiar contra a mulher, entre outras:

      II - a violência psicológica, entendida como qualquer conduta que lhe cause dano emocional e diminuição
      da autoestima ou que lhe prejudique e perturbe o pleno desenvolvimento ou que vise degradar ou controlar
      suas ações, comportamentos, crenças e decisões, mediante ameaça, constrangimento, humilhação, manipulação,
      isolamento, vigilância constante, perseguição contumaz, insulto, chantagem, violação de sua intimidade,
      ridicularização, exploração e limitação do direito de ir e vir ou qualquer outro meio que lhe cause
      prejuízo à saúde psicológica e à autodeterminação;'
  - n: 2
    fonte: Código Penal (Decreto-Lei nº 2.848/1940), Art. 147-A
    texto: 'Perseguição

      Art. 147-A. Perseguir alguém, reiteradamente e por qualquer meio, ameaçando-lhe a integridade física
      ou psicológica, restringindo-lhe a capacidade de locomoção ou, de qualquer forma, invadindo ou perturbando
      sua esfera de liberdade ou privacidade.

      Pena – reclusão, de 6 (seis) meses a 2 (dois) anos, e multa.

      § 1º A pena é aumentada de metade se o crime é cometido:

      I – contra criança, adolescente ou idoso;

      II – contra mulher por razões da condição de sexo feminino, nos termos do § 2º-A do art. 121 deste
      Código;

      III – mediante concurso de 2 (duas) ou mais pessoas ou com o emprego de arma.

      § 2º As penas deste artigo são aplicáveis sem prejuízo das correspondentes à violência.

      § 3º Somente se procede mediante representação.'
