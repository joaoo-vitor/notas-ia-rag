- item: j0240
  pergunta: Ele me xinga todo dia por eu não arrumar a casa do jeito que ele quer
  resposta: Sinto muito que você esteja passando por isso. O que você descreveu, como xingamentos constantes,
    é considerado violência psicológica, que causa danos à sua saúde emocional e autoestima. A Lei Maria
    da Penha (Lei 11.340/2006) protege você contra esse tipo de comportamento, definindo-o como uma forma
    de violência doméstica. Você não está sozinha e existem órgãos especializados para te acolher. Você
    pode buscar ajuda em um Centro de Referência da Mulher, na Delegacia da Mulher ou ligar para o número
    180 para receber orientação e saber como proceder para garantir sua segurança.
  trechos_fornecidos: []
  referencia:
  - n: 1
    fonte: Lei nº 11.340/2006 (Lei Maria da Penha), Art. 7, inciso II
    texto: 'Art. 7º São formas de violência doméstica e familiar contra a mulher, entre outras:

      II - a violência psicológica, entendida como qualquer conduta que lhe cause dano emocional e diminuição
      da autoestima ou que lhe prejudique e perturbe o pleno desenvolvimento ou que vise degradar ou controlar
      suas ações, comportamentos, crenças e decisões, mediante ameaça, constrangimento, humilhação, manipulação,
      isolamento, vigilância constante, perseguição contumaz, insulto, chantagem, violação de sua intimidade,
      ridicularização, exploração e limitação do direito de ir e vir ou qualquer outro meio que lhe cause
      prejuízo à saúde psicológica e à autodeterminação;'
  - n: 2
    fonte: Lei nº 11.340/2006 (Lei Maria da Penha), Art. 7, inciso V
    texto: 'Art. 7º São formas de violência doméstica e familiar contra a mulher, entre outras:

      V - a violência moral, entendida como qualquer conduta que configure calúnia, difamação ou injúria.'
  - n: 3
    fonte: Código Penal (Decreto-Lei nº 2.848/1940), Art. 147-B
    texto: 'Violência psicológica contra a mulher

      Art. 147-B. Causar dano emocional à mulher que a prejudique e perturbe seu pleno desenvolvimento
      ou que vise a degradar ou a controlar suas ações, comportamentos, crenças e decisões, mediante ameaça,
      constrangimento, humilhação, manipulação, isolamento, chantagem, ridicularização, limitação do direito
      de ir e vir ou qualquer outro meio que cause prejuízo à sua saúde psicológica e autodeterminação:

      Pena - reclusão, de 6 (seis) meses a 2 (dois) anos, e multa, se a conduta não constitui crime mais
      grave.

      Parágrafo único. A pena é aumentada de metade se o crime é cometido mediante uso de inteligência
      artificial ou de qualquer outro recurso tecnológico que altere imagem ou som da vítima.'
  fiel: sim
  correcao: correta
  utilidade: 5
  comentario: ''
- item: j0085
  pergunta: Preciso de advogado? E se eu não puder pagar?
  resposta: Você deve estar acompanhada de um advogado em todos os atos processuais, tanto no âmbito cível
    quanto no criminal [1]. Caso não possa pagar, a lei garante o acesso aos serviços da Defensoria Pública
    ou de Assistência Judiciária Gratuita, com atendimento específico e humanizado tanto na delegacia
    quanto na justiça [2]. Além disso, o juiz tem o poder de determinar o seu encaminhamento para órgãos
    de assistência judiciária, caso precise [4, 5].
  trechos_fornecidos:
  - n: 1
    fonte: Lei nº 11.340/2006 (Lei Maria da Penha), Art. 27
    texto: Art. 27. Em todos os atos processuais, cíveis e criminais, a mulher em situação de violência
      doméstica e familiar deverá estar acompanhada de advogado, ressalvado o previsto no art. 19 desta
      Lei.
  - n: 2
    fonte: Lei nº 11.340/2006 (Lei Maria da Penha), Art. 28
    texto: Art. 28. É garantido a toda mulher em situação de violência doméstica e familiar o acesso aos
      serviços de Defensoria Pública ou de Assistência Judiciária Gratuita, nos termos da lei, em sede
      policial e judicial, mediante atendimento específico e humanizado.
  - n: 3
    fonte: Lei nº 11.340/2006 (Lei Maria da Penha), Art. 12-B
    texto: 'Art. 12-B. (VETADO).

      § 3º A autoridade policial poderá requisitar os serviços públicos necessários à defesa da mulher
      em situação de violência doméstica e familiar e de seus dependentes.'
  - n: 4
    fonte: Lei nº 11.340/2006 (Lei Maria da Penha), Art. 18
    texto: 'Art. 18. Recebido o expediente com o pedido da ofendida, caberá ao juiz, no prazo de 48 (quarenta
      e oito) horas:

      I - conhecer do expediente e do pedido e decidir sobre as medidas protetivas de urgência;

      II - determinar o encaminhamento da ofendida ao órgão de assistência judiciária, quando for o caso,
      inclusive para o ajuizamento da ação de separação judicial, de divórcio, de anulação de casamento
      ou de dissolução de união estável perante o juízo competente;

      III - comunicar ao Ministério Público para que adote as providências cabíveis.

      IV - determinar a apreensão imediata de arma de fogo sob a posse do agressor.'
  - n: 5
    fonte: Lei nº 11.340/2006 (Lei Maria da Penha), Art. 9 (parte 1/2)
    texto: 'Art. 9º A assistência à mulher em situação de violência doméstica e familiar será prestada
      em caráter prioritário no Sistema Único de Saúde (SUS) e no Sistema Único de Segurança Pública (Susp),
      de forma articulada e conforme os princípios e as diretrizes previstos na Lei nº 8.742, de 7 de
      dezembro de 1993 (Lei Orgânica da Assistência Social), e em outras normas e políticas públicas de
      proteção, e emergencialmente, quando for o caso.

      § 1º O juiz determinará, por prazo certo, a inclusão da mulher em situação de violência doméstica
      e familiar no cadastro de programas assistenciais do governo federal, estadual e municipal.

      § 2º O juiz assegurará à mulher em situação de violência doméstica e familiar, para preservar sua
      integridade física e psicológica:

      I - acesso prioritário à remoção quando servidora pública, integrante da administração direta ou
      indireta;

      II - manutenção do vínculo trabalhista, quando necessário o afastamento do local de trabalho, por
      até seis meses.

      III - encaminhamento à assistência judiciária, quando for o caso, inclusive para eventual ajuizamento
      da ação de separação judicial, de divórcio, de anulação de casamento ou de dissolução de união estável
      perante o juízo competente.

      § 3º A assistência à mulher em situação de violência doméstica e familiar compreenderá o acesso
      aos benefícios decorrentes do desenvolvimento científico e tecnológico, incluindo os serviços de
      contracepção de emergência, a profilaxia das Doenças Sexualmente Transmissíveis (DST) e da Síndrome
      da Imunodeficiência Adquirida (AIDS) e outros procedimentos médicos necessários e cabíveis nos casos
      de violência sexual.

      Aquele que, por ação ou omissão, causar lesão, violência física, sexual ou psicológica e dano moral
      ou patrimonial a mulher fica obrigado a ressarcir todos os danos causados, inclusive ressarcir ao
      Sistema Único de Saúde (SUS), de acordo com a tabela SUS, os custos relativos aos serviços de saúde
      prestados para o total tratamento das vítimas em situação de violência doméstica e familiar, recolhidos
      os recursos assim arrecadados ao Fundo de Saúde do ente federado responsável pelas unidades de saúde
      que prestarem os serviços.

      § 5º Os dispositivos de segurança destinados ao uso em caso de perigo iminente e disponibilizados
      para o monitoramento das vítimas de violência doméstica ou familiar amparadas por medidas protetivas
      terão seus custos ressarcidos pelo agressor.'
  referencia:
  - n: 1
    fonte: Lei nº 11.340/2006 (Lei Maria da Penha), Art. 27
    texto: Art. 27. Em todos os atos processuais, cíveis e criminais, a mulher em situação de violência
      doméstica e familiar deverá estar acompanhada de advogado, ressalvado o previsto no art. 19 desta
      Lei.
  - n: 2
    fonte: Lei nº 11.340/2006 (Lei Maria da Penha), Art. 28
    texto: Art. 28. É garantido a toda mulher em situação de violência doméstica e familiar o acesso aos
      serviços de Defensoria Pública ou de Assistência Judiciária Gratuita, nos termos da lei, em sede
      policial e judicial, mediante atendimento específico e humanizado.
  fiel: sim
  correcao: correta
