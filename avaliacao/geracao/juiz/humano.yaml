- item: j0073
  pergunta: é eu que tenho que entregar intimação pra ele?
  resposta: Não, você não precisa fazer isso. O trabalho de entregar intimações e comunicações oficiais
    é do Poder Judiciário, geralmente realizado por um oficial de justiça. De acordo com a Lei Maria da
    Penha, o Estado tem o dever de garantir a segurança e o suporte necessário para que a mulher não precise
    ter contato direto com o agressor durante o processo. Se alguém lhe sugerir isso, saiba que essa não
    é sua responsabilidade e você pode recusar. Caso se sinta pressionada, procure a Defensoria Pública
    ou o Ministério Público para orientações sobre como o processo está sendo conduzido no seu caso.
  trechos_fornecidos: []
  referencia:
  - n: 1
    fonte: Lei nº 11.340/2006 (Lei Maria da Penha), Art. 21
    texto: 'Art. 21. A ofendida deverá ser notificada dos atos processuais relativos ao agressor, especialmente
      dos pertinentes ao ingresso e à saída da prisão, sem prejuízo da intimação do advogado constituído
      ou do defensor público.

      Parágrafo único. A ofendida não poderá entregar intimação ou notificação ao agressor .'
