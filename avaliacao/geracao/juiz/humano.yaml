- item: j0166
  pergunta: Ele mandou foto minha nua pro amigo sem a minha permissão
  resposta: Sinto muito que você esteja passando por isso. Segundo a lei, divulgar ou transmitir foto
    ou vídeo de nudez, sem o consentimento da vítima, é crime [1]. Como houve o envio para outra pessoa,
    essa conduta se enquadra na divulgação ou transmissão não autorizada de cena de nudez [1]. A pena
    prevista para esse crime pode ser aumentada se o autor mantiver ou tiver mantido relação íntima de
    afeto com a vítima, ou se o objetivo for vingança ou humilhação [1].
  trechos_fornecidos:
  - n: 1
    fonte: Código Penal (Decreto-Lei nº 2.848/1940), Art. 218-C
    texto: 'Art. 218-C. Oferecer, trocar, disponibilizar, transmitir, vender ou expor à venda, distribuir,
      publicar ou divulgar, por qualquer meio - inclusive por meio de comunicação de massa ou sistema
      de informática ou telemática -, fotografia, vídeo ou outro registro audiovisual que contenha cena
      de estupro ou de estupro de vulnerável ou que faça apologia ou induza a sua prática, ou, sem o consentimento
      da vítima, cena de sexo, nudez ou pornografia:

      Pena – reclusão, de 4 (quatro) a 10 (dez) anos, e multa, se o fato não constitui crime mais grave.

      Aumento de pena

      § 1º A pena é aumentada de 1/3 (um terço) a 2/3 (dois terços) se o crime é praticado por agente
      que mantém ou tenha mantido relação íntima de afeto com a vítima ou com o fim de vingança ou humilhação.

      Exclusão de ilicitude

      § 2º Não há crime quando o agente pratica as condutas descritas no caput deste artigo em publicação
      de natureza jornalística, científica, cultural ou acadêmica com a adoção de recurso que impossibilite
      a identificação da vítima, ressalvada sua prévia autorização, caso seja maior de 18 (dezoito) anos.'
  - n: 2
    fonte: Código Penal (Decreto-Lei nº 2.848/1940), Art. 216-B
    texto: 'Registro não autorizado da intimidade sexual

      Art. 216-B. Produzir, fotografar, filmar ou registrar, por qualquer meio, conteúdo com cena de nudez
      ou ato sexual ou libidinoso de caráter íntimo e privado sem autorização dos participantes:

      Pena - detenção, de 6 (seis) meses a 1 (um) ano, e multa.

      Parágrafo único. Na mesma pena incorre quem realiza montagem em fotografia, vídeo, áudio ou qualquer
      outro registro com o fim de incluir pessoa em cena de nudez ou ato sexual ou libidinoso de caráter
      íntimo.'
  - n: 3
    fonte: Código Penal (Decreto-Lei nº 2.848/1940), Art. 215-A
    texto: 'Importunação sexual

      Art. 215-A. Praticar contra alguém e sem a sua anuência ato libidinoso com o objetivo de satisfazer
      a própria lascívia ou a de terceiro:

      Pena - reclusão, de 1 (um) a 5 (cinco) anos, se o ato não constitui crime mais grave.'
  - n: 4
    fonte: Código Penal (Decreto-Lei nº 2.848/1940), Art. 181
    texto: 'Art. 181 - É isento de pena quem comete qualquer dos crimes previstos neste título, em prejuízo:

      I - do cônjuge, na constância da sociedade conjugal;

      II - de ascendente ou descendente, seja o parentesco legítimo ou ilegítimo, seja civil ou natural.'
  - n: 5
    fonte: Código Penal (Decreto-Lei nº 2.848/1940), Art. 213
    texto: 'Estupro

      Art. 213. Constranger alguém, mediante violência ou grave ameaça, a ter conjunção carnal ou a praticar
      ou permitir que com ele se pratique outro ato libidinoso:

      Pena - reclusão, de 6 (seis) a 10 (dez) anos.

      § 1o Se da conduta resulta lesão corporal de natureza grave ou se a vítima é menor de 18 (dezoito)
      ou maior de 14 (catorze) anos:

      Pena - reclusão, de 8 (oito) a 12 (doze) anos.

      § 2o Se da conduta resulta morte:

      Pena - reclusão, de 12 (doze) a 30 (trinta) anos'
