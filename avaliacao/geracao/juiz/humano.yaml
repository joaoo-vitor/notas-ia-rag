- item: j0114
  pergunta: ele ameaçou me matar
  resposta: Sinto muito que você esteja passando por isso. A ameaça de causar mal injusto e grave é considerada
    crime [1]. Se essa ameaça acontece por razões da sua condição de mulher, a pena para o agressor é
    aplicada em dobro [1]. Nesses casos específicos de violência contra a mulher, a lei estabelece que
    o processo ocorre independentemente da sua representação, ou seja, a autoridade pode agir automaticamente
    [1].
  trechos_fornecidos:
  - n: 1
    fonte: Código Penal (Decreto-Lei nº 2.848/1940), Art. 147
    texto: 'Ameaça

      Art. 147 - Ameaçar alguém, por palavra, escrito ou gesto, ou qualquer outro meio simbólico, de causar-lhe
      mal injusto e grave:

      Pena - detenção, de um a seis meses, ou multa.

      § 1º Se o crime é cometido contra a mulher por razões da condição do sexo feminino, nos termos do
      § 1º do art. 121-A deste Código, aplica-se a pena em dobro.

      § 2º Somente se procede mediante representação, exceto na hipótese prevista no § 1º deste artigo.'
  referencia:
  - n: 1
    fonte: Código Penal (Decreto-Lei nº 2.848/1940), Art. 147
    texto: 'Ameaça

