- item: j0076
  pergunta: Ele quebra tudo que eu compro pra mim, diz que não mereço
  resposta: Sinto muito que você esteja passando por isso. Destruir ou inutilizar objetos que pertencem
    a outra pessoa é considerado um crime de dano [1]. A lei prevê punição para quem causa esse tipo de
    prejuízo, sendo que a pena pode ser mais rigorosa se o ato for feito com violência contra a pessoa
    ou se causar um prejuízo considerável à vítima [1]. É importante buscar apoio para sua segurança.
  trechos_fornecidos:
  - n: 1
    fonte: Código Penal (Decreto-Lei nº 2.848/1940), Art. 163
    texto: 'Dano

      Art. 163 - Destruir, inutilizar ou deteriorar coisa alheia:

      Pena - detenção, de um a seis meses, ou multa.

      Dano qualificado

      Parágrafo único - Se o crime é cometido:

      I - com violência à pessoa ou grave ameaça;

      II - com emprego de substância inflamável ou explosiva, se o fato não constitui crime mais grave

      III - contra o patrimônio da União, de Estado, do Distrito Federal, de Município ou de autarquia,
      fundação pública, empresa pública, sociedade de economia mista ou empresa concessionária de serviços
      públicos;

      IV - por motivo egoístico ou com prejuízo considerável para a vítima:

      Pena - detenção, de seis meses a três anos, e multa, além da pena correspondente à violência.'
