- item: j0334
  pergunta: O juiz pode me dar separação dos corpos?
  resposta: Sim, o juiz pode determinar a separação de corpos quando necessário [2]. Essa medida está
    prevista na Lei Maria da Penha para proteger mulheres em situação de violência doméstica e familiar
    [2].
  trechos_fornecidos:
  - n: 1
    fonte: Lei nº 11.340/2006 (Lei Maria da Penha), Art. 18
    texto: 'Art. 18. Recebido o expediente com o pedido da ofendida, caberá ao juiz, no prazo de 48 (quarenta
      e oito) horas:

      I - conhecer do expediente e do pedido e decidir sobre as medidas protetivas de urgência;

      II - determinar o encaminhamento da ofendida ao órgão de assistência judiciária, quando for o caso,
      inclusive para o ajuizamento da ação de separação judicial, de divórcio, de anulação de casamento
      ou de dissolução de união estável perante o juízo competente;

      III - comunicar ao Ministério Público para que adote as providências cabíveis.

      IV - determinar a apreensão imediata de arma de fogo sob a posse do agressor.'
  - n: 2
    fonte: Lei nº 11.340/2006 (Lei Maria da Penha), Art. 23
    texto: 'Art. 23. Poderá o juiz, quando necessário, sem prejuízo de outras medidas:

      I - encaminhar a ofendida e seus dependentes a programa oficial ou comunitário de proteção ou de
      atendimento;

      II - determinar a recondução da ofendida e a de seus dependentes ao respectivo domicílio, após afastamento
      do agressor;

      III - determinar o afastamento da ofendida do lar, sem prejuízo dos direitos relativos a bens, guarda
      dos filhos e alimentos;

      IV - determinar a separação de corpos.

      V - determinar a matrícula dos dependentes da ofendida em instituição de educação básica mais próxima
      do seu domicílio, ou a transferência deles para essa instituição, independentemente da existência
      de vaga.

      VI – conceder à ofendida auxílio-aluguel, com valor fixado em função de sua situação de vulnerabilidade
      social e econômica, por período não superior a 6 (seis) meses.'
  - n: 3
    fonte: Código Penal (Decreto-Lei nº 2.848/1940), Art. 129 (parte 1/2)
    texto: 'Lesão corporal

      Art. 129. Ofender a integridade corporal ou a saúde de outrem:

      Pena - detenção, de três meses a um ano.

      Lesão corporal de natureza grave

      § 1º Se resulta:

      I - Incapacidade para as ocupações habituais, por mais de trinta dias;

      II - perigo de vida;

      III - debilidade permanente de membro, sentido ou função;

      IV - aceleração de parto:

      Pena - reclusão, de um a cinco anos.

      § 2° Se resulta:

      I - Incapacidade permanente para o trabalho;

      II - enfermidade incuravel;

      III perda ou inutilização do membro, sentido ou função;

      IV - deformidade permanente;

      V - aborto:

      Pena - reclusão, de dois a oito anos.

      Lesão corporal seguida de morte

      § 3° Se resulta morte e as circunstâncias evidenciam que o agente não quís o resultado, nem assumiu
      o risco de produzí-lo:

      Pena - reclusão, de quatro a doze anos.

      § 3º-A. No crime previsto no § 3º deste artigo, se cometido no contexto da atuação ou para a consecução
      das condutas previstas no art. 2º da lei que institui o marco legal do combate ao crime organizado
      no Brasil:

      Pena - reclusão, de 20 (vinte) a 40 (quarenta) anos.

      Diminuição de pena

      § 4° Se o agente comete o crime impelido por motivo de relevante valor social ou moral ou sob o
      domínio de violenta emoção, logo em seguida a injusta provocação da vítima, o juiz pode reduzir
      a pena de um sexto a um terço.

      Substituição da pena

      § 5° O juiz, não sendo graves as lesões, pode ainda substituir a pena de detenção pela de multa,
      de duzentos mil réis a dois contos de réis:

      I - se ocorre qualquer das hipóteses do parágrafo anterior;

      II - se as lesões são recíprocas.

      Lesão corporal culposa

      § 6° Se a lesão é culposa:

      Pena - detenção, de dois meses a um ano.

      Aumento de pena

      § 7o Aumenta-se a pena de 1/3 (um terço) se ocorrer qualquer das hipóteses dos §§ 4o e 6o do art.
      121 deste Código.

      § 8º - Aplica-se à lesão culposa o disposto no § 5º do art. 121.

      § 8º-A. Com exceção do disposto no § 3º-A deste artigo, aumenta-se a pena em 2/3 (dois terços) se
      a lesão é praticada por integrante de organização criminosa ultraviolenta, grupo paramilitar ou
      milícia privada, no contexto da atuação ou para a consecução das condutas previstas no art. 2º da
      lei que institui o marco legal do combate ao crime organizado no Brasil.'
  - n: 4
    fonte: Lei nº 11.340/2006 (Lei Maria da Penha), Art. 14-A
    texto: 'Art. 14-A. A ofendida tem a opção de propor ação de divórcio ou de dissolução de união estável
      no Juizado de Violência Doméstica e Familiar contra a Mulher.

      § 1º Exclui-se da competência dos Juizados de Violência Doméstica e Familiar contra a Mulher a pretensão
      relacionada à partilha de bens.

      § 2º Iniciada a situação de violência doméstica e familiar após o ajuizamento da ação de divórcio
      ou de dissolução de união estável, a ação terá preferência no juízo onde estiver.'
  - n: 5
    fonte: Lei nº 11.340/2006 (Lei Maria da Penha), Art. 22 (parte 1/2)
    texto: 'Art. 22. Constatada a prática de violência doméstica e familiar contra a mulher, nos termos
      desta Lei, o juiz poderá aplicar, de imediato, ao agressor, em conjunto ou separadamente, as seguintes
      medidas protetivas de urgência, entre outras:

      I - suspensão da posse ou restrição do porte de armas, com comunicação ao órgão competente, nos
      termos da Lei nº 10.826, de 22 de dezembro de 2003 ;

      II - afastamento do lar, domicílio ou local de convivência com a ofendida;

      III - proibição de determinadas condutas, entre as quais:

      a) aproximação da ofendida, de seus familiares e das testemunhas, fixando o limite mínimo de distância
      entre estes e o agressor;

      b) contato com a ofendida, seus familiares e testemunhas por qualquer meio de comunicação;

      c) freqüentação de determinados lugares a fim de preservar a integridade física e psicológica da
      ofendida;

      IV - restrição ou suspensão de visitas aos dependentes menores, ouvida a equipe de atendimento multidisciplinar
      ou serviço similar;

      V - prestação de alimentos provisionais ou provisórios.

      VI – comparecimento do agressor a programas de recuperação e reeducação; e

      VII – acompanhamento psicossocial do agressor, por meio de atendimento individual e/ou em grupo
      de apoio.

      VIII – monitoração eletrônica, disponibilizando-se à vítima aplicação ou dispositivo de segurança
      que alerte sobre eventual aproximação do agressor.

      § 1º As medidas referidas neste artigo não impedem a aplicação de outras previstas na legislação
      em vigor, sempre que a segurança da ofendida ou as circunstâncias o exigirem, devendo a providência
      ser comunicada ao Ministério Público.

      § 2º Na hipótese de aplicação do inciso I, encontrando-se o agressor nas condições mencionadas no
      caput e incisos do art. 6º da Lei nº 10.826, de 22 de dezembro de 2003, o juiz comunicará ao respectivo
      órgão, corporação ou instituição as medidas protetivas de urgência concedidas e determinará a restrição
      do porte de armas, ficando o superior imediato do agressor responsável pelo cumprimento da determinação
      judicial, sob pena de incorrer nos crimes de prevaricação ou de desobediência, conforme o caso.

      § 3º Para garantir a efetividade das medidas protetivas de urgência, poderá o juiz requisitar, a
      qualquer momento, auxílio da força policial.

      § 4º Na aplicação das medidas protetivas de urgência, o juiz concederá a tutela específica ou determinará
      providências que assegurem a obtenção de tutela pelo resultado prático equivalente.'
  referencia:
  - n: 1
    fonte: Lei nº 11.340/2006 (Lei Maria da Penha), Art. 23
    texto: 'Art. 23. Poderá o juiz, quando necessário, sem prejuízo de outras medidas:

      I - encaminhar a ofendida e seus dependentes a programa oficial ou comunitário de proteção ou de
      atendimento;

      II - determinar a recondução da ofendida e a de seus dependentes ao respectivo domicílio, após afastamento
      do agressor;

      III - determinar o afastamento da ofendida do lar, sem prejuízo dos direitos relativos a bens, guarda
      dos filhos e alimentos;

      IV - determinar a separação de corpos.

      V - determinar a matrícula dos dependentes da ofendida em instituição de educação básica mais próxima
      do seu domicílio, ou a transferência deles para essa instituição, independentemente da existência
      de vaga.

      VI – conceder à ofendida auxílio-aluguel, com valor fixado em função de sua situação de vulnerabilidade
      social e econômica, por período não superior a 6 (seis) meses.'
  fiel: sim
  correcao: correta
