# Gabarito do RAG: perguntas em linguagem leiga e os artigos que respondem cada uma.
#
# Campos:
#   id              identificador estável (não reutilizar depois de apagar)
#   pergunta        como uma usuária escreveria, com o registro indicado em "tipo"
#   tipo            direta (usa termos da lei) | coloquial | adversa (gíria, sem acento,
#                   abreviação, erro de digitação) | sem_resposta (a base não responde)
#   relevantes      artigos que respondem a pergunta (id do artigo no corpus, sem "-p1/-p2")
#   parciais        artigos que ajudam, mas não respondem sozinhos (opcional)
#   trechos_relevantes partes exatas quando um artigo relevante foi dividido (opcional;
#                   ex.: lei-11340-2006:art22-p1). Para artigo não dividido é automático.
#   trechos_parciais partes exatas quando um artigo parcial foi dividido (opcional)
#   status          rascunho | revisado   (só "revisado" entra nos números oficiais)
#   revisores       quem conferiu (duas pessoas, sem ver a resposta uma da outra)
#   origem          de onde veio a pergunta: grupo | ia | faq | pesquisa (opcional)
#
# Os itens abaixo são um RASCUNHO inicial escrito com auxílio de IA. Cada relevância foi
# conferida contra o texto do corpus, mas precisa da revisão do grupo antes de valer.
# Meta: 150 a 300 perguntas, com pelo menos 15% sem_resposta e 20% adversas.

