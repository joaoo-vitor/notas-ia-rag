# Fontes do corpus jurídico do RAG.
#
# Só entra no índice o que estiver listado aqui. Antes de acrescentar uma fonte,
# conferir autoria, vigência, jurisdição e licença (ver arquitetura-chat-codex-eduardo-f/fontes.md).
#
# artigos: quando presente, só esses artigos do documento entram no corpus
#          (para documentos grandes como o Código Penal e a Constituição).
# extracao: trechos_textuais permite selecionar parágrafos de páginas oficiais que
#          não são divididas em artigos. Cada item usa uma frase distintiva em
#          "contem"; se a página mudar e a frase sumir, a ingestão falha.

